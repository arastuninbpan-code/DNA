  function bindTransactionGestures() {
    $$('.tx-interactive').forEach(el=>{
      let timer=null, startX=0, startY=0, dx=0, dragging=false;
      el.addEventListener('pointerdown',e=>{
        startX=e.clientX; startY=e.clientY; dx=0; dragging=false;
        el.style.transition='none';
        timer=setTimeout(()=>{timer=null;el.style.transition='transform .22s ease';el.style.transform='';showTransactionActions(+el.dataset.txIndex);},550);
      });
      el.addEventListener('pointermove',e=>{
        const mx=e.clientX-startX, my=e.clientY-startY;
        if(Math.abs(mx)>8||Math.abs(my)>8){
          if(timer){clearTimeout(timer);timer=null;}
          if(Math.abs(mx)>Math.abs(my) && mx<0){
            dragging=true; dx=Math.max(-110,mx);
            el.style.transform=`translateX(${dx}px)`;
          }
        }
      });
      const end=()=>{
        if(timer){clearTimeout(timer);timer=null;}
        const trigger=dragging&&dx<-55;
        el.style.transition='transform .22s ease';
        el.style.transform='translateX(0)';
        if(trigger) showTransactionActions(+el.dataset.txIndex);
        setTimeout(()=>{el.style.transition='';},240);
      };
      el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
      el.addEventListener('contextmenu',e=>{e.preventDefault();showTransactionActions(+el.dataset.txIndex);});
    });
  }
  function holdFeedback(el) {
    try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function')navigator.vibrate(18);}catch(_){}
    if(!reducedMotion())el.animate?.([{opacity:1},{opacity:.65},{opacity:1}],{duration:180,easing:'ease-out'});
  }
  function bindLongPress(el,cb) {
    let timer=null,sx=0,sy=0,pointer=null,fired=false,suppressUntil=0;
    const cancel=()=>{if(timer!==null)clearTimeout(timer);timer=null;};
    el.cancelLongPress=cancel;
    const activate=()=>{cancel();if(fired||!el.isConnected||el.closest('.habit-swipe')?.classList.contains('is-dragging'))return;fired=true;suppressUntil=performance.now()+800;holdFeedback(el);cb();};
    el.addEventListener('pointerdown',e=>{
      cancel();if(e.isPrimary===false||e.button!==0)return;
      sx=e.clientX;sy=e.clientY;pointer=e.pointerId;fired=false;timer=setTimeout(activate,600);
    },{passive:true});
    el.addEventListener('pointermove',e=>{if(e.pointerId===pointer&&Math.hypot(e.clientX-sx,e.clientY-sy)>8)cancel();},{passive:true});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,cancel,{passive:true}));
    el.addEventListener('click',e=>{if(performance.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation();}},{capture:true});
    el.addEventListener('contextmenu',e=>{e.preventDefault();if(performance.now()>=suppressUntil)fired=false;activate();});
  }

  // -------- Finance actions / overlays --------
  function overlay(html, {sheet=false, closeOnBackdrop=true}={}) {
    const root=$('#overlay-root');
    root.innerHTML=`<div class="overlay ${sheet?'sheet-overlay':''}" id="active-overlay">${html}</div>`;
    const ov=$('#active-overlay');
    if(closeOnBackdrop) ov.addEventListener('pointerdown',e=>{if(e.target===ov)closeOverlay();});
    document.removeEventListener('keydown',escClose);
    document.addEventListener('keydown',escClose);
    return ov;
  }
  function escClose(e){if(e.key==='Escape')closeOverlay();}
  function closeOverlay(){document.removeEventListener('keydown',escClose);$('#overlay-root').innerHTML='';}
  function showToast(text,ok=false){
    clearTimeout(toastTimer);clearTimeout(toastRemoveTimer);
    const root=$('#toast-root');root.replaceChildren();
    const d=document.createElement('div');d.className='toast'+(ok?' ok':'');d.setAttribute('role','status');
    d.dataset.expires=String(Date.now()+2500);
    const message=document.createElement('span');message.textContent=text;
    const close=document.createElement('button');close.type='button';close.textContent='×';close.setAttribute('aria-label','Закрыть уведомление');
    function dismiss(){clearTimeout(toastTimer);if(!d.isConnected)return;d.classList.add('toast-exit');toastRemoveTimer=setTimeout(()=>d.remove(),reducedMotion()?0:180);}
    close.onclick=dismiss;d.append(message,close);root.appendChild(d);toastTimer=setTimeout(dismiss,2300);
  }
  function formField(id,placeholder,type='text',value=''){return `<input class="field" id="${id}" type="${type}" placeholder="${placeholder}" value="${esc(value)}" />`;}
  function typeToggle(value) { return `<div class="type-toggle"><button class="type-btn expense ${value==='expense'?'active':''}" data-type="expense">Расход</button><button class="type-btn income ${value==='income'?'active':''}" data-type="income">Доход</button></div>`; }
  function bindTypeToggle(container, initial, callback){let type=initial;$$('[data-type]',container).forEach(b=>b.onclick=()=>{type=b.dataset.type;$$('[data-type]',container).forEach(x=>x.classList.toggle('active',x.dataset.type===type));callback(type);});}

  let pdfJsPromise=null;
  async function ensurePdfJs(){if(window.pdfjsLib)return window.pdfjsLib;if(!pdfJsPromise){pdfJsPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';resolve(window.pdfjsLib);};s.onerror=reject;document.head.appendChild(s);});}return pdfJsPromise;}
  async function parsePdfFile(file){const lib=await ensurePdfJs();const bytes=new Uint8Array(await file.arrayBuffer());const doc=await lib.getDocument({data:bytes}).promise;let text='';for(let i=1;i<=doc.numPages;i++){const page=await doc.getPage(i);const tc=await page.getTextContent();let lastY=null,line='';for(const item of tc.items){const y=item.transform?.[5];if(lastY!==null&&Math.abs(y-lastY)>3){text+=line+'\n';line='';}line+=(line?' ':'')+item.str;lastY=y;}text+=line+'\n';}text=text.replace(/afii\d+/g,'').replace(/[^\w\s\d.,:;+₽\nа-яА-ЯёЁa-zA-Z-]/g,' ').replace(/ {2,}/g,' ');const lines=text.split('\n').map(s=>s.trim()).filter(Boolean);return parsePdfLines(lines);}
  function parsePdfLines(lines) {
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const dm = line.match(/^(\d{2}\.\d{2}\.\d{2})(?:\s+(\d{2}:\d{2}))?$/);
      if (!dm) {
        i++;
        continue;
      }

      const dateStr = dm[1];
      const timeStr = dm[2];
      i++;

      // The Flutter parser accepts an optional processing date followed by
      // two ₽ amount lines. The first amount is intentionally ignored, just
      // like in DocumentParser.parseTinkoffPdf().
      let procDate = null;
      let amount1 = null;
      let amount2 = null;
      let desc = '';

      if (i < lines.length && /^\d{2}\.\d{2}\.\d{2}$/.test(lines[i])) {
        procDate = lines[i];
        i++;
      }
      if (i < lines.length && lines[i].includes('₽')) {
        amount1 = lines[i];
        i++;
      }
      if (i < lines.length && lines[i].includes('₽')) {
        amount2 = lines[i];
        i++;
      }

      while (i < lines.length && !/^\d{2}\.\d{2}\.\d{2}/.test(lines[i])) {
        desc += lines[i] + ' ';
        i++;
      }
      desc = desc.replace(/\s+/g, ' ').trim();

      if (!amount2 || desc.length < 3) continue;

      const skip = [
        'баланс', 'выписка', 'дата', 'сумма', 'описание',
        'операции по карте', 'расходы', 'поступления', 'кэшбэк', 'дьячков'
      ];
      if (skip.some(w => desc.toLowerCase().includes(w))) continue;

      const d = parseBankDate(dateStr);
      if (!d) continue;
      if (timeStr) {
        const [hh, mm] = timeStr.split(':').map(Number);
        d.setHours(hh, mm, 0, 0);
      }

      const isIncome = amount2.includes('+') || isIncomeDesc(desc);
      const amount = parseBankAmount(amount2);
      if (amount == null || amount === 0) continue;

      const finalAmount = isIncome ? Math.abs(amount) : -Math.abs(amount);
      out.push({
        amount: Math.abs(finalAmount),
        category: categorizeBank(desc),
        type: finalAmount >= 0 ? 'income' : 'expense',
        note: desc,
        date: isoDate(d),
        id: `${d.getTime()}_${finalAmount}`,
        fingerprint: `${d.getTime()}_${finalAmount}`,
      });
    }
    return out;
  }
  function parseBankDate(s){const m=s.match(/(\d{2})\.(\d{2})\.(\d{2})/);if(!m)return null;let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  function categorizeBank(desc){const d=desc.toLowerCase();if(d.includes('пополнение')||d.includes('сбп')||d.includes('кэшбэк')||d.includes('внутрибанковский перевод с')||d.includes('atm'))return'Пополнение';if(d.includes('внутренний перевод')||d.includes('перевод на')||d.includes('+7920')||d.includes('+7953'))return'Переводы';if(d.includes('apteka'))return'Здоровье';if(d.includes('bristol')||d.includes('fixprice'))return'Продукты';if(d.includes('siticard')||d.includes('transport'))return'Транспорт';if(d.includes('yandex')&&d.includes('go'))return'Транспорт';if(d.includes('master gsm')||d.includes('t-mobile')||d.includes('mbank'))return'Связь';if(d.includes('na naberezhnoj')||d.includes('qsr')||d.includes('skuratov'))return'Рестораны';if(d.includes('darkside'))return'Развлечения';return'Другое';}

  function renameHabit(index,name,dateKey,expectedName) {
    name=String(name||'').trim();
    if(!name)return {ok:false,error:'Введи название привычки.'};
    if(name.length>120)return {ok:false,error:'Название — не длиннее 120 символов.'};
    const current=state.habits.data[dateKey]?.[index];
    if(!current||current.name!==expectedName||habitDateKey(state.habits.selectedDate)!==dateKey)return {ok:false,error:'Список изменился. Открой привычку заново.'};
    if(name===expectedName)return {ok:true};
    const keys=Object.keys(state.habits.data).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&k>=dateKey&&Array.isArray(state.habits.data[k])&&state.habits.data[k].some(h=>h.name===expectedName));
    if(keys.some(k=>state.habits.data[k].some(h=>h.name===name)))return {ok:false,error:'Привычка с таким названием уже есть. Выбери другое.'};
    const next={...state.habits.data};keys.forEach(k=>{next[k]=next[k].map(h=>h.name===expectedName?{...h,name}:h);});
    try{localStorage.setItem('dna_habits_v2',JSON.stringify(next));}catch(_){return {ok:false,error:'Не удалось сохранить. Проверь свободное место в браузере.'};}
    state.habits.data=next;return {ok:true};
  }

  function calendarDays(cal){const first=new Date(cal.display.getFullYear(),cal.display.getMonth(),1),weekday=(first.getDay()+6)%7,prev=new Date(cal.display.getFullYear(),cal.display.getMonth()-1,1),daysPrev=new Date(prev.getFullYear(),prev.getMonth()+1,0).getDate(),daysCurr=new Date(cal.display.getFullYear(),cal.display.getMonth()+1,0).getDate(),next=new Date(cal.display.getFullYear(),cal.display.getMonth()+1,1),days=[];for(let i=weekday-1;i>=0;i--)days.push(new Date(prev.getFullYear(),prev.getMonth(),daysPrev-i));for(let i=1;i<=daysCurr;i++)days.push(new Date(cal.display.getFullYear(),cal.display.getMonth(),i));const rem=(7-(days.length%7))%7;for(let i=1;i<=rem;i++)days.push(new Date(next.getFullYear(),next.getMonth(),i));return days;}
  function bindCalendarEvents(ov,cal){const rerender=(focus=false)=>{const root=$('#active-overlay');root.innerHTML=calendarMarkup(cal);bindCalendarEvents(root,cal);if(focus){const inp=$('#cal-search',root);inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}};$('[data-cal-close]',ov).onclick=closeOverlay;$('[data-cal-today]',ov).onclick=()=>{const t=dateOnly();cal.selected=t;cal.display=new Date(t.getFullYear(),t.getMonth(),1);rerender();};$$('[data-cal-month]',ov).forEach(b=>b.onclick=()=>{cal.display=new Date(cal.display.getFullYear(),cal.display.getMonth()+(+b.dataset.calMonth),1);rerender();});$$('[data-cal-year]',ov).forEach(b=>b.onclick=()=>{cal.display=new Date(cal.display.getFullYear()+(+b.dataset.calYear),cal.display.getMonth(),1);rerender();});$$('[data-cal-date]',ov).forEach(b=>b.onclick=()=>{cal.selected=parseLocalDate(b.dataset.calDate);rerender();});$('[data-cal-confirm]',ov).onclick=()=>{closeOverlay();selectHabitDate(cal.selected);};const input=$('#cal-search',ov);input.oninput=()=>{cal.query=input.value;cal.suggestions=calendarSuggestions(cal.query);rerender(true);};input.onkeydown=e=>{if(e.key==='Enter'){const d=parseCalendarDate(input.value);if(d){cal.selected=d;cal.display=new Date(d.getFullYear(),d.getMonth(),1);cal.query='';cal.suggestions=[];rerender();}}};$$('[data-suggestion]',ov).forEach(b=>b.onclick=()=>{const s=cal.suggestions[+b.dataset.suggestion],d=parseCalendarDate(s);if(d){cal.selected=d;cal.display=new Date(d.getFullYear(),d.getMonth(),1);cal.query='';cal.suggestions=[];rerender();}});}
  function formatCalendarSelected(d){return `${d.getDate()} ${calMonthNames[d.getMonth()]} ${d.getFullYear()}`;}
  function calendarSelectedSub(d){if(sameDay(d,state.habits.today))return'Сегодня';if(d<state.habits.today){const diff=Math.round((state.habits.today-d)/86400000);if(diff===1)return'Вчера';if(diff===2)return'Позавчера';return`${diff} дней назад`;}return'Будущий день';}
  function calendarSuggestions(q){q=String(q||'').trim().toLowerCase();if(!q)return[];const out=[],now=new Date();if('сегодня'.includes(q)||'сег'.includes(q))out.push('Сегодня');if('вчера'.includes(q)||'вчер'.includes(q))out.push('Вчера');if('позавчера'.includes(q)||'поза'.includes(q))out.push('Позавчера');if('завтра'.includes(q))out.push('Завтра');if('послезавтра'.includes(q))out.push('Послезавтра');const pd=parseCalendarDate(q);if(pd){const month=calMonthNames[pd.getMonth()];out.push(`${pd.getDate()} ${month} ${pd.getFullYear()}`,`${pd.getDate()}.${pd.getMonth()+1}.${pd.getFullYear()}`,`${pd.getDate()}/${pd.getMonth()+1}/${pd.getFullYear()}`);}const months=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];months.forEach(m=>{if(m.includes(q)||m.substring(0,3).includes(q))out.push(`${m} ${now.getFullYear()}`,`${m} ${now.getFullYear()-1}`,`${m} ${now.getFullYear()+1}`);});for(let y=now.getFullYear()-5;y<=now.getFullYear()+5;y++)if(String(y).includes(q))out.push(String(y));const dm=q.match(/^(\d{1,2})[.\/-](\d{1,2})$/);if(dm){const d=+dm[1],m=+dm[2];if(m>=1&&m<=12&&d>=1&&d<=31)out.push(`${d}.${m}.${now.getFullYear()}`,`${d}/${m}/${now.getFullYear()}`,`${d}-${m}-${now.getFullYear()}`);}months.forEach((m,i)=>{if(q.includes(m)||q.includes(m.substring(0,3))){const x=q.match(/(\d{1,2})/);if(x){const d=+x[1];if(d>=1&&d<=31)out.push(`${d} ${m} ${now.getFullYear()}`);}}});return [...new Set(out)].slice(0,8);}
  function parseCalendarDate(input){const s=String(input||'').trim().toLowerCase();if(!s)return null;const now=new Date();if(['сегодня','today','сег'].includes(s))return dateOnly();if(['вчера','yesterday','вчер'].includes(s))return addDays(dateOnly(),-1);if(['позавчера','поза'].includes(s))return addDays(dateOnly(),-2);if(['завтра','tomorrow'].includes(s))return addDays(dateOnly(),1);if(s==='послезавтра')return addDays(dateOnly(),2);let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?$/);if(m){let d=+m[1],mo=+m[2],y=m[3]?+m[3]:now.getFullYear();if(y<100)y+=2000;if(d>=1&&d<=31&&mo>=1&&mo<=12)return new Date(y,mo-1,d);}const names=calMonthNames.map(x=>x.toLowerCase());for(let i=0;i<names.length;i++){const mn=names[i];if(s.includes(mn)||s.includes(mn.substring(0,3))){const parts=s.split(/\s+/);let d=null,y=null;for(const part of parts){const n=Number(part);if(Number.isInteger(n)){if(n>=1&&n<=31)d=n;if(n>=2000&&n<=2100)y=n;}}if(d!=null)return new Date(y||now.getFullYear(),i,d);}}for(let i=0;i<names.length;i++){const mn=names[i];if(s===mn||s===mn.substring(0,3))return new Date(now.getFullYear(),i,1);if(s.includes(mn)&&/\d{4}/.test(s)){const ym=s.match(/(\d{4})/);if(ym)return new Date(+ym[1],i,1);}}const only=Number(s);if(Number.isInteger(only)&&only>=2000&&only<=2100)return new Date(only,0,1);if(Number.isInteger(only)&&only>=1&&only<=31){const last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();if(only<=last)return new Date(now.getFullYear(),now.getMonth(),only);}m=s.match(/^(\d{1,2})[./](\d{1,2})$/);if(m){const d=+m[1],mo=+m[2];if(d>=1&&d<=31&&mo>=1&&mo<=12)return new Date(now.getFullYear(),mo-1,d);}for(let i=0;i<names.length;i++){const mn=names[i];if(s.includes(mn)||s.includes(mn.substring(0,3))){const dm=s.match(/(\d{1,2})/);if(dm){const d=+dm[1];if(d>=1&&d<=31)return new Date(now.getFullYear(),i,d);}}}m=s.match(/^(\d{1,2})[./](\d{1,2})[./](\d{2})$/);if(m)return new Date(2000+(+m[3]),(+m[2])-1,+m[1]);return null;}

  // -------- Canvas drawing / animations --------
  function hexAlpha(hex,a){const c=hex.replace('#','');const n=parseInt(c.length===3?c.split('').map(x=>x+x).join(''):c,16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;}
  function setupCanvas(canvas){const rect=canvas.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1);const w=Math.max(1,Math.round(rect.width*dpr)),h=Math.max(1,Math.round(rect.height*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return {ctx,w:rect.width,h:rect.height,dpr};}
  function drawFinanceCharts(){const donut=$('.donut-canvas');if(donut)drawDonut(donut);const line=$('.line-chart');if(line)drawFinanceLine(line);}
  function drawDonut(canvas){const {ctx,w,h}=setupCanvas(canvas);ctx.clearRect(0,0,w,h);const exp=Object.entries(expensesByCategory()).sort((a,b)=>b[1]-a[1]),total=exp.reduce((s,e)=>s+e[1],0);if(!exp.length||!total)return;const cx=w/2,cy=h/2,r=Math.min(w,h)/2-10;let start=-Math.PI/2;ctx.lineWidth=20;ctx.lineCap='round';for(const [k,v] of exp){const sweep=v/total*Math.PI*2;ctx.beginPath();ctx.strokeStyle=categoryColors[k]||'#999';ctx.arc(cx,cy,r,start,start+sweep,false);ctx.stroke();start+=sweep;}ctx.fillStyle='#1A1A1A';ctx.beginPath();ctx.arc(cx,cy,Math.max(0,r-25),0,Math.PI*2);ctx.fill();}
  function drawFinanceLine(canvas){const {ctx,w,h}=setupCanvas(canvas);ctx.clearRect(0,0,w,h);const pts=chartPoints();if(!pts.length)return;const max=Math.max(...pts),min=Math.min(...pts),range=Math.max(1,max-min),hh=h-20;ctx.strokeStyle=GOLD;ctx.lineWidth=2;ctx.beginPath();pts.forEach((v,i)=>{const x=pts.length===1?0:i/(pts.length-1)*w,y=10+(1-(v-min)/range)*hh;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();}
  function animateFinanceNumbers(){$$('[data-animate-number]').forEach(el=>{const end=Number(el.dataset.animateNumber)||0,prefix=el.dataset.prefix||'',start=performance.now(),dur=600;function f(now){const t=clamp((now-start)/dur,0,1),v=end*easeOutCubic(t);el.textContent=prefix+formatNum(v);if(t<1)requestAnimationFrame(f);}requestAnimationFrame(f);});}
  function drawHabitsVisuals(){drawDiscipline(state.habits.animatingDate?state.habits.circleDisplay:progressForDate(state.habits.selectedDate));drawHabitsChart(state.habits.animatingDate?0:1);animateCounts();}
  function drawDiscipline(progress) {
    const canvas = $('.discipline-canvas');
    if (!canvas) return;
    const {ctx,w,h} = setupCanvas(canvas);
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const r = Math.min(w, h) / 2 - 56;

    // A finite radial falloff fits in the padded canvas; the ring size is unchanged.
    if(progress>0){
      const outer=r+40,k=.5+progress*.5,glow=ctx.createRadialGradient(cx,cy,Math.max(0,r-8),cx,cy,outer);
      glow.addColorStop(0,hexAlpha(GOLD,.14*k));glow.addColorStop(.35,hexAlpha(GOLD,.07*k));glow.addColorStop(1,hexAlpha(GOLD,0));
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,outer,0,Math.PI*2);ctx.fill();
    }

    ctx.fillStyle = 'rgba(255,255,255,.03)';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = hexAlpha(GOLD, .15);
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

    if (progress > 0) {
      const arcR = r - 4;
      const sweep = Math.PI * 2 * clamp(progress, 0, 1);
      let gradient;
      if (ctx.createConicGradient) {
        gradient = ctx.createConicGradient(-Math.PI / 2, cx, cy);
        gradient.addColorStop(0, '#C9A84C');
        gradient.addColorStop(.25, '#D4AF37');
        gradient.addColorStop(.5, '#E8C84A');
        gradient.addColorStop(.75, '#D4AF37');
        gradient.addColorStop(1, '#C9A84C');
      } else {
        gradient = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
        gradient.addColorStop(0, '#C9A84C');
        gradient.addColorStop(.25, '#D4AF37');
        gradient.addColorStop(.5, '#E8C84A');
        gradient.addColorStop(.75, '#D4AF37');
        gradient.addColorStop(1, '#C9A84C');
      }
      ctx.lineCap = 'round';
      ctx.lineWidth = 6;
      ctx.strokeStyle = gradient;
      ctx.beginPath();
      if (progress >= .99) ctx.arc(cx, cy, arcR, 0, Math.PI * 2);
      else ctx.arc(cx, cy, arcR, -Math.PI/2, -Math.PI/2+sweep);
      ctx.stroke();

      ctx.save();
      if (progress >= .99) {
        ctx.strokeStyle = hexAlpha(GOLD, .15);
        ctx.shadowColor = hexAlpha(GOLD, .15);
        ctx.shadowBlur = 25;
        ctx.lineWidth = 12;
        ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.stroke();
      } else {
        const a = .06 * (.5 + progress * .5);
        ctx.strokeStyle = hexAlpha(GOLD, a);
        ctx.shadowColor = hexAlpha(GOLD, a);
        ctx.shadowBlur = 20;
        ctx.lineWidth = 12;
        ctx.beginPath(); ctx.arc(cx, cy, arcR, -Math.PI/2, -Math.PI/2+sweep); ctx.stroke();
      }
      ctx.restore();
    }

    // Flutter passes isPerfect only after the celebration content has faded.
    const perfectVisible = progress >= .99 && state.habits.perfectPulse && Date.now() >= state.habits.celebrationUntil;
    if (perfectVisible) {
      const phase = (performance.now() % 2400) / 2400; // 1200ms forward + 1200ms reverse
      const wave = .5 - .5 * Math.cos(phase * Math.PI * 2);
      const fireValue = 1 + .25 * wave;

      ctx.save();
      ctx.fillStyle = hexAlpha(GOLD, .06 * fireValue);
      ctx.shadowColor = hexAlpha(GOLD, .06 * fireValue);
      ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.arc(cx, cy, r + 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.fillStyle = hexAlpha(GOLD, .03 * fireValue);
      ctx.shadowColor = hexAlpha(GOLD, .03 * fireValue);
      ctx.shadowBlur = 35;
      ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      requestAnimationFrame(() => {
        if (state.nav === 3 && state.habits.perfectPulse && Date.now() >= state.habits.celebrationUntil) {
          drawDiscipline(progressForDate(state.habits.selectedDate));
        }
      });
    }
  }

  function drawHabitsChart(animationValue=1) {
    const canvas = $('.habits-chart');
    if (!canvas) return;
    const {ctx,w,h} = setupCanvas(canvas), dates = allDates();
    ctx.clearRect(0,0,w,h);
    const padTop=24, padBottom=24, chartH=h-padTop-padBottom, yBase=h-padBottom;

    ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=.5;
    for(let i=1;i<=4;i++){
      const y=yBase-chartH*i/4;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
    }

    const points=[], values=[];
    for(let i=0;i<dates.length;i++){
      const d=dates[i];
      const target=d>state.habits.today?0:clamp(progressForDate(d),0,1);
      values.push(target);
      const x=DAY_ITEM_WIDTH+DAY_ITEM_WIDTH*i;
      let display=target;
      if(state.habits.animatingDate&&sameDay(d,state.habits.animatingDate)){
        const prev=state.habits.previousProgressMap[habitDateKey(d)] ?? target;
        display=prev+(target-prev)*clamp(animationValue,0,1);
      }
      points.push([x,yBase-chartH*clamp(display,0,1)]);
    }

    canvas.habitHitPoints=points.map(([x,y],i)=>({x,y,date:dates[i]}));
    for(let i=0;i<points.length-1;i++){
      const [x1,y1]=points[i],[x2,y2]=points[i+1];
      ctx.save();
      ctx.strokeStyle=hexAlpha(GOLD,.15); ctx.lineWidth=6; ctx.lineCap='round';
      ctx.shadowColor=hexAlpha(GOLD,.15); ctx.shadowBlur=8;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle=GOLD; ctx.lineWidth=2.5; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }

    for(let i=0;i<points.length;i++){
      const d=dates[i], [x,y]=points[i];
      const selected=sameDay(d,state.habits.selectedDate), p=values[i], perfect=isPerfectDay(d), r=selected?8:4.5;

      ctx.save();
      ctx.fillStyle=hexAlpha(GOLD,selected ? .25 : .1);
      ctx.shadowColor=hexAlpha(GOLD,selected ? .25 : .1);
      ctx.shadowBlur=selected?20:12;
      ctx.beginPath(); ctx.arc(x,y,selected?18:12,0,Math.PI*2); ctx.fill();
      ctx.restore();

      if(selected){
        ctx.save();
        ctx.fillStyle=hexAlpha(GOLD,.1); ctx.shadowColor=hexAlpha(GOLD,.1); ctx.shadowBlur=30;
        ctx.beginPath(); ctx.arc(x,y,25,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      ctx.fillStyle='rgba(255,255,255,.08)';
      ctx.beginPath(); ctx.arc(x,y,r+2,0,Math.PI*2); ctx.fill();

      if(p>0){
        ctx.strokeStyle=GOLD; ctx.lineWidth=2; ctx.lineCap='round';
        ctx.beginPath(); ctx.arc(x,y,r+1,-Math.PI/2,-Math.PI/2+Math.PI*2*p); ctx.stroke();
      }

      ctx.fillStyle=GOLD;
      ctx.beginPath(); ctx.arc(x,y,Math.max(1,r-2),0,Math.PI*2); ctx.fill();

      if(perfect&&p>=1){
        ctx.save();
        ctx.fillStyle='rgba(255,165,0,.35)'; ctx.shadowColor='rgba(255,165,0,.35)'; ctx.shadowBlur=12;
        ctx.beginPath(); ctx.arc(x,y,r+8,0,Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.save();
        ctx.fillStyle='rgba(255,165,0,.15)'; ctx.shadowColor='rgba(255,165,0,.15)'; ctx.shadowBlur=20;
        ctx.beginPath(); ctx.arc(x,y,r+14,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }

      if(selected){
        ctx.strokeStyle=hexAlpha(GOLD,.3); ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(x,y,r+3,0,Math.PI*2); ctx.stroke();
      }
    }

    const fade=DAY_ITEM_WIDTH+DAY_ITEM_WIDTH*.3, gr=ctx.createLinearGradient(0,0,fade,0);
    gr.addColorStop(0,'rgba(10,10,10,.95)'); gr.addColorStop(1,'rgba(10,10,10,0)');
    ctx.fillStyle=gr; ctx.fillRect(0,0,fade,h);
  }
  function animateCounts(){$$('[data-count-to]').forEach(el=>el.textContent=String(+el.dataset.countTo||0));}

  function refreshHabitClock(now=new Date()) {
    const today=dateOnly(now);
    if(!sameDay(today,state.habits.today)){
      const followedToday=sameDay(state.habits.selectedDate,state.habits.today);state.habits.today=today;
      if(followedToday)state.habits.selectedDate=today;
      cancelAnimationFrame(habitAnimationFrame);state.habits.animatingDate=null;
      state.habits.circleDisplay=progressForDate(state.habits.selectedDate);
      if(state.nav===3)renderScreen();
    }
    if(state.nav!==3)return;
    const label=$('#motivation-text'),text=motivationText(now);
    if(label&&label.textContent!==text){label.textContent=text;if(!reducedMotion())label.animate?.([{opacity:.5},{opacity:1}],{duration:180,easing:'ease-out'});}
  }

  // -------- Startup --------
  let lastNavTap=null;
  function scrollSectionToTop() {
    const key=currentViewKey(),sc=currentScroller(),behavior=reducedMotion()?'instant':'smooth';
    viewScroll.set(key,0);if(sc){if(sc.scrollTo)sc.scrollTo({top:0,behavior});else sc.scrollTop=0;}
    if(state.nav===0)state.finance.scrollTop=0;
    if(state.nav===3){state.habits.habitsScrollTop=0;const list=$('.habits-list');if(list){if(list.scrollTo)list.scrollTo({top:0,behavior});else list.scrollTop=0;}}
  }
  function onNavTap(index,now=performance.now()) {
    if(index<0||index>=navItems.length)return;
    const twice=lastNavTap!==null&&lastNavTap.index===index&&now-lastNavTap.at<=350;
    lastNavTap=twice?null:{index,at:now};switchNav(index);if(twice)scrollSectionToTop();
  }
  $('#bottom-nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)onNavTap(+b.dataset.nav);});
  $('#bottom-nav').addEventListener('keydown',e=>{if(e.key==='Home'&&e.target.closest('[data-nav]')){e.preventDefault();scrollSectionToTop();}});

  renderNav();
  renderScreen();
  state.habits.circleDisplay=progressForDate(state.habits.selectedDate);
  // Broker requests are paused until a secure, verified integration is available.

  document.addEventListener('visibilitychange',()=>{
    document.documentElement.toggleAttribute('data-paused',document.hidden);
    if(document.hidden)return;
    $$('#toast-root .toast').forEach(t=>{if(Number(t.dataset.expires)<=Date.now())t.remove();});
    refreshHabitClock();
  });
  setInterval(()=>{if(!document.hidden&&state.nav===3)refreshHabitClock();},30000);

  window.addEventListener('resize',()=>{if(state.nav===0)drawFinanceCharts();if(state.nav===3)drawHabitsVisuals();});
  window.addEventListener('beforeunload',storeCurrentScroll);

  const splash=$('#splash'), app=$('#app');
  $('#splash-mark').innerHTML=renderDnaLoader('',false,true);
  app.hidden=false;app.inert=true;
  document.documentElement.toggleAttribute('data-paused',document.hidden);
  function finishSplash(){
    app.inert=false;app.classList.add('app-reveal');splash.classList.add('hide');
    setTimeout(()=>{splash.remove();app.classList.remove('app-reveal');},reducedMotion()?0:380);
  }
  setTimeout(finishSplash,reducedMotion()?0:850);
})();
