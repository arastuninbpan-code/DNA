  <style>
:root {
  --gold: #c9a84c;
  --gold2: #d6b756;
  --gold3: #e8c84a;
  --bg: #0a0a0a;
  --bg-deep: #050505;
  --surface: #111111;
  --surface2: #0d0d0d;
  --surface3: #1a1a1a;
  --white: #ffffff;
  --muted: rgba(255,255,255,.38);
  --muted2: rgba(255,255,255,.54);
  --green: #4caf50;
  --red: #ff5a5a;
  --nav-h: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
body {
  color: var(--white);
  font-family: Georgia, 'Times New Roman', serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; }
button, [role="button"], .tap { cursor: pointer; user-select: none; }
.app-shell {
  position: relative;
  width: 100%;
  height: 100dvh;
  min-height: 100%;
  background: var(--bg);
  overflow: hidden;
}
.screen-host {
  position: absolute;
  inset: 0 0 calc(var(--nav-h) + var(--safe-bottom)) 0;
  overflow: hidden;
  background: var(--bg);
}
.screen {
  position: absolute;
  inset: 0;
  overflow: auto;
  scrollbar-width: none;
  background: var(--bg);
}
.screen::-webkit-scrollbar, .hide-scrollbar::-webkit-scrollbar { display: none; }
.hide-scrollbar { scrollbar-width: none; }
.safe-top { padding-top: max(16px, env(safe-area-inset-top, 0px)); }

/* Shared vector motion: a rising DNA/hourglass motif. */
.splash {position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;transition:opacity .36s ease;gap:24px;}
.splash.hide {opacity:0;pointer-events:none;}
.splash-wordmark {font-family:Georgia,'Times New Roman',serif;color:#dfc681;font-size:32px;font-weight:400;letter-spacing:.18em;margin-left:.18em;}
.splash-subtitle {margin:0 20px;text-align:center;letter-spacing:.2em;font-size:10px;line-height:1.6;color:#a99d7e;}
.dna-loader {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;margin:20px auto;color:var(--gold);}
.dna-symbol {width:64px;height:96px;display:block;overflow:hidden;mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent);}
.dna-loader-large {margin:0;}
.dna-loader-large .dna-symbol {width:96px;height:144px;}
.dna-track {animation:dnaRise 2.6s linear infinite;}
.dna-strand {fill:none;stroke:#c9a84c;stroke-width:2;stroke-linecap:round;}
.dna-strand-back {stroke:#8a723d;stroke-width:1.5;}
.dna-rung {stroke:#b19753;stroke-width:1;opacity:.45;}
.dna-loader-label {font-size:14px;color:#aaa18c;text-align:center;line-height:1.5;}
.dna-unavailable {display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;gap:12px;}
.dna-unavailable h1 {font-size:24px;font-weight:400;margin:0;}
.dna-unavailable p {color:#aaa18c;max-width:320px;font-size:14px;line-height:1.6;margin:0;}
.dna-unavailable .dna-loader {margin:0 0 12px;}
.dna-loader-quiet .dna-track {animation-duration:4s;}
.app-reveal {animation:appReveal .36s ease both;}
html[data-paused] .dna-track,dialog:not([open]) .dna-track {animation-play-state:paused;}
@keyframes dnaRise {from{transform:translateY(0)}to{transform:translateY(-80px)}}
@keyframes appReveal {from{opacity:0}to{opacity:1}}
@keyframes fadeUp {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.dna-track,.app-reveal{animation:none!important}.splash{transition:none}}
/* Bottom navigation */
.bottom-nav {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  align-items: center;
  background: var(--bg);
  border-top: .5px solid var(--gold);
  z-index: 20;
}
.nav-item {
  height: var(--nav-h);
  border: 0;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,.38);
  padding: 0;
  transition: color .18s ease, transform .18s ease;
}
.nav-item.active { color: var(--gold); }
.nav-item:active { transform: scale(.94); }
.nav-center .nav-icon-wrap {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1.5px solid var(--gold);
  display: grid;
  place-items: center;
}
.icon { width: 22px; height: 22px; display: inline-block; vertical-align: middle; flex: 0 0 auto; }
.icon svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.fill svg { fill: currentColor; stroke: none; }

/* Shared */
.page-pad { padding-left: 24px; padding-right: 24px; }
.title-28 { font-size: 28px; font-weight: 600; line-height: 1.1; }
.text-13 { font-size: 13px; }
.muted { color: rgba(255,255,255,.4); }
.gold { color: var(--gold); }
.card {
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 20px;
}
.gradient-card {
  background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
  border: 1px solid rgba(201,168,76,.25);
}
.pressable { transition: transform .16s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease; }
.pressable:active { transform: scale(.97); }
.fade-switch { animation: fadeSwitch .2s ease both; }
@keyframes fadeSwitch { from { opacity:0; transform: translateY(2px);} to { opacity:1; transform:none;} }

/* Home */
.home-screen {
  display: flex; flex-direction: column;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 24px max(24px, env(safe-area-inset-left, 0px));
}
.home-toolbar { width: 100%; max-width: 960px; margin: 0 auto; display: flex; justify-content: flex-end; }
.home-icon-button {
  flex: 0 0 auto; width: 48px; height: 48px; display: grid; place-items: center;
  border: 1px solid rgba(201,168,76,.25); border-radius: 50%; background: var(--surface); color: var(--gold);
}
.home-icon-button .icon { width: 22px; height: 22px; }
.home-stage { flex: 1; min-height: 240px; display: grid; place-items: center; padding: 32px 0 64px; text-align: center; }
.home-voice { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.home-mic {
  width: clamp(120px, 24vw, 164px); height: clamp(120px, 24vw, 164px); border-radius: 50%;
  border: 1px solid var(--gold); display: grid; place-items: center; color: var(--gold);
  background: radial-gradient(circle at 50% 35%, rgba(201,168,76,.1), #0d0d0d 75%);
  box-shadow: 0 0 0 10px rgba(201,168,76,.035), 0 0 48px rgba(201,168,76,.055);
}
.home-mic .icon { width: 48px; height: 48px; }
.home-voice-status { margin: 0; color: #b6aa88; font-size: .875rem; line-height: 1.5; }
.home-screen button:focus-visible, .home-settings button:focus-visible, .voice-dialog button:focus-visible {
  outline: 2px solid var(--gold2); outline-offset: 5px;
}
.home-settings { padding: max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 32px max(20px, env(safe-area-inset-left, 0px)); }
.settings-inner { max-width: 640px; margin: 0 auto; }
.settings-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
.settings-header h1 { margin: 0; font-size: 1.5rem; font-weight: 400; }
.settings-card { padding: 22px; margin-top: 16px; border: 1px solid rgba(201,168,76,.2); border-radius: 18px; background: var(--surface); }
.settings-card h2 { margin: 0 0 12px; font-size: 1rem; font-weight: 400; color: var(--gold); }
.settings-card p, .voice-dialog p { margin: 10px 0 0; font-size: 1rem; line-height: 1.65; color: #c1bfb9; }
.settings-meta { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0; }
.settings-meta dt { font-size: 1rem; color: #c1bfb9; }
.settings-meta dd { margin: 0; font-size: 1.125rem; color: var(--gold2); font-variant-numeric: tabular-nums; }
.settings-card .settings-note { font-size: .875rem; color: #a9a7a0; }
.voice-dialog { width: min(440px, calc(100% - 40px)); max-height: 80dvh; overflow: auto; padding: 26px; border: 1px solid rgba(201,168,76,.4); border-radius: 22px; background: #111; color: #fff; }
.voice-dialog::backdrop { background: rgba(0,0,0,.78); }
.voice-dialog h2 { margin: 0; color: var(--gold); font-size: 1.375rem; font-weight: 400; }
.voice-dialog button { margin-top: 24px; min-height: 48px; width: 100%; border: 1px solid var(--gold); border-radius: 12px; background: rgba(201,168,76,.1); color: var(--gold2); font-size: 1rem; }
@media (prefers-reduced-motion: reduce) {
  .home-screen .pressable, .home-settings .pressable { transition: none; }
  .home-screen .pressable:active, .home-settings .pressable:active { transform: none; }
}

/* Placeholder */
.placeholder-screen { height:100%; display:grid; place-items:center; padding-top:env(safe-area-inset-top,0px); background:var(--bg); }
.placeholder-title { font-size:24px; color:#fff; }

/* Finance */
.finance-screen {
  min-height: 100%;
  background:
    radial-gradient(ellipse 120% 55% at 50% -5%, rgba(214,183,86,.08), rgba(214,183,86,0) 60%),
    var(--bg-deep);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding-top: max(16px, env(safe-area-inset-top, 0px));
}
.finance-header { display:flex; align-items:center; justify-content:space-between; padding:0 24px; }
.finance-subtitle { margin-top:3px; color:rgba(255,255,255,.4); font-family:Georgia,'Times New Roman',serif; font-size:13px; }
.round-link {
  width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.38);
}
.round-link.connected { background:rgba(201,168,76,.15); border-color:rgba(201,168,76,.4); color:var(--gold); }
.finance-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 24px; margin-top:20px; }
.finance-tab {
  min-width:0; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03);
  color:rgba(255,255,255,.5); border-radius:12px; padding:11px 4px; font-size:13px; font-weight:600; text-align:center;
  transition:all .2s ease;
}
.finance-tab.active { border-color:transparent; background:linear-gradient(135deg,var(--gold2),#c9a94e); color:#0a0a0a; }
.finance-content { flex:1; min-height:0; margin-top:24px; overflow:hidden; }
.finance-scroll { height:100%; overflow-y:auto; scrollbar-width:none; padding:8px 24px 32px; }
.finance-scroll::-webkit-scrollbar { display:none; }
.balance-card {
  padding:24px; border-radius:24px; background:linear-gradient(135deg,#1a1a1a,#0a0a0a);
  border:1px solid rgba(201,168,76,.25); box-shadow:0 0 40px rgba(201,168,76,.05);
  transition: border-radius .35s cubic-bezier(.16,.84,.28,1), border-color .35s, box-shadow .35s, min-height .35s;
}
.balance-card.expanded { border-radius:32px; border-color:rgba(201,168,76,.35); box-shadow:0 0 40px rgba(201,168,76,.12); }
.balance-label { color:rgba(255,255,255,.54); font-family:Georgia,'Times New Roman',serif; font-size:13px; }
.balance-value { margin-top:8px; font-family:Georgia,'Times New Roman',serif; color:#fff; font-size:40px; font-weight:700; letter-spacing:-1px; }
.balance-totals { display:flex; flex-wrap:wrap; gap:20px; margin-top:12px; font-family:Georgia,'Times New Roman',serif; }
.balance-total { display:flex; align-items:center; gap:4px; font-size:13px; }
.balance-hint { margin-top:8px; color:rgba(255,255,255,.25); font-family:Georgia,'Times New Roman',serif; font-size:11px; }
.donut-wrap { text-align:center; }
.donut-title { font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:600; }
.donut-canvas { width:180px; height:180px; margin:20px auto 0; display:block; }
.donut-legend { margin-top:16px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px 12px; }
.legend-item { display:flex; align-items:center; gap:6px; color:rgba(255,255,255,.54); font-family:Georgia,'Times New Roman',serif; font-size:11px; }
.legend-dot { width:10px; height:10px; border-radius:2px; }
.metric-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:20px; }
.metric-card { padding:14px; border-radius:18px; background:#0d0d0d; border:1px solid rgba(255,255,255,.06); min-width:0; transition:all .25s ease; }
.metric-card .icon { width:18px; height:18px; }
.metric-label { margin-top:10px; color:rgba(255,255,255,.5); font-family:Georgia,'Times New Roman',serif; font-size:10px; }
.metric-value { margin-top:4px; font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.metric-extra { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.4); font-family:Georgia,'Times New Roman',serif; font-size:10px; animation:fadeSwitch .2s ease both; }
.advice-card { margin-top:20px; padding:18px; }
.advice-row { display:flex; align-items:flex-start; }
.advice-pulse { width:3px; height:45px; flex:0 0 auto; border-radius:2px; background:var(--gold); animation:pulseOpacity 2s ease-in-out infinite alternate; }
@keyframes pulseOpacity { from{opacity:.6} to{opacity:1} }
.advice-body { margin-left:14px; flex:1; min-width:0; }
.advice-head { display:flex; align-items:center; gap:6px; color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:12px; font-weight:600; }
.advice-head .icon { width:15px; height:15px; animation:pulseOpacity 2s ease-in-out infinite alternate; }
.advice-text { margin-top:6px; color:rgba(255,255,255,.7); font-family:Georgia,'Times New Roman',serif; font-size:13px; line-height:1.35; }
.insight { margin-top:8px; display:flex; align-items:flex-start; gap:8px; color:rgba(255,255,255,.54); font-family:Georgia,'Times New Roman',serif; font-size:12px; }
.insight .icon { width:14px; height:14px; color:var(--gold); margin-top:1px; }
.chart-section { margin-top:20px; padding:18px; }
.section-title { font-family:Georgia,'Times New Roman',serif; font-size:15px; font-weight:600; }
.pill-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
.pill { border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:rgba(255,255,255,.54); border-radius:12px; padding:6px 12px; font-family:Georgia,'Times New Roman',serif; font-size:11px; }
.pill.active-period { background:rgba(201,168,76,.2); border-color:var(--gold); color:var(--gold); }
.pill.active-mode { background:var(--gold); border-color:var(--gold); color:#000; }
.line-chart-wrap { position:relative; height:120px; margin-top:16px; }
.line-chart { width:100%; height:120px; display:block; }
.empty-data { height:120px; display:grid; place-items:center; color:rgba(255,255,255,.3); font-family:Georgia,'Times New Roman',serif; font-size:13px; }
.recent-card { margin-top:20px; padding:18px; }

.tx-swipe-wrap { position:relative; overflow:hidden; border-radius:14px; margin-bottom:6px; }
.tx-swipe-wrap .tx-tile { margin-bottom:0; position:relative; z-index:1; background:#090909; touch-action:pan-y; }
.tx-swipe-bg { position:absolute; inset:0; z-index:0; display:flex; align-items:center; justify-content:flex-end; gap:16px; padding-right:24px; color:rgba(255,255,255,.7); background:linear-gradient(to right,transparent,rgba(255,90,90,.3)); }
.tx-swipe-bg .icon:last-child { color:var(--red); }
.tx-tile { margin-bottom:6px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.04); display:flex; align-items:center; }
.tx-icon { width:36px; height:36px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center; }
.tx-icon .icon { width:18px; height:18px; }
.tx-main { margin-left:12px; min-width:0; flex:1; font-family:Georgia,'Times New Roman',serif; }
.tx-cat { font-size:13px; font-weight:500; color:#fff; }
.tx-note { margin-top:2px; color:rgba(255,255,255,.35); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx-amount { margin-left:10px; white-space:nowrap; font-family:Georgia,'Times New Roman',serif; font-size:14px; font-weight:600; }
.primary-button, .secondary-button {
  width:100%; border-radius:16px; padding:14px 24px; display:flex; justify-content:center; align-items:center; gap:10px;
  font-family:Georgia,'Times New Roman',serif; font-size:14px; font-weight:600; border:0;
}
.primary-button { margin-top:24px; background:linear-gradient(135deg,var(--gold2),#c9a94e); color:#000; }
.secondary-button { background:rgba(255,255,255,.03); border:1px solid rgba(201,168,76,.25); color:var(--gold); }
.primary-button .icon, .secondary-button .icon { width:20px; height:20px; }

/* Finance empty / history / goals / investments */
.center-state { height:100%; min-height:360px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
.state-icon { width:80px; height:80px; border-radius:50%; display:grid; place-items:center; background:rgba(201,168,76,.08); border:1px solid rgba(201,168,76,.2); color:var(--gold); }
.state-icon.small { width:72px; height:72px; }
.state-icon .icon { width:36px; height:36px; }
.state-title { margin-top:20px; font-family:Georgia,'Times New Roman',serif; font-size:18px; font-weight:600; }
.state-sub { margin-top:8px; color:rgba(255,255,255,.4); font-family:Georgia,'Times New Roman',serif; font-size:13px; }
.center-state .primary-button, .center-state .secondary-button { margin-top:24px; width:auto; min-width:220px; }
.history-wrap { height:100%; display:flex; flex-direction:column; }
.history-head { padding:0 24px; display:flex; align-items:center; }
.history-head-title { flex:1; font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:600; }
.filter-btn { display:flex; align-items:center; gap:4px; padding:6px 10px; border-radius:12px; border:1px solid rgba(201,168,76,.3); color:var(--gold); background:transparent; font-family:Georgia,'Times New Roman',serif; font-size:12px; }
.filter-btn .icon { width:16px; height:16px; }
.add-round { width:36px; height:36px; border-radius:50%; border:1px solid rgba(201,168,76,.4); color:var(--gold); background:transparent; display:grid; place-items:center; margin-left:8px; }
.add-round .icon { width:20px; height:20px; }
.history-list { flex:1; min-height:0; overflow-y:auto; padding:0 24px 100px; scrollbar-width:none; }
.history-list::-webkit-scrollbar{display:none}
.date-group-title { margin:18px 0 6px; color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:11px; letter-spacing:2px; font-weight:600; }
.goal-list, .asset-list { height:100%; overflow-y:auto; padding:0 24px 32px; scrollbar-width:none; }
.goal-list::-webkit-scrollbar, .asset-list::-webkit-scrollbar { display:none; }
.goal-card { margin-bottom:14px; padding:18px; border-radius:20px; background:#0d0d0d; border:1px solid rgba(255,255,255,.06); transition:all .25s ease; }
.goal-card.expanded { border-color:rgba(201,168,76,.3); }
.goal-row { display:flex; align-items:center; }
.goal-ring { width:52px; height:52px; flex:0 0 auto; position:relative; display:grid; place-items:center; }
.goal-ring svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.goal-ring-track { fill:none; stroke:rgba(255,255,255,.1); stroke-width:3; }
.goal-ring-value { fill:none; stroke:var(--gold); stroke-width:3; stroke-linecap:round; transition:stroke-dashoffset .3s ease; }
.goal-ring-text { position:relative; color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:10px; font-weight:600; }
.goal-main { margin-left:16px; flex:1; min-width:0; font-family:Georgia,'Times New Roman',serif; }
.goal-name { font-size:15px; font-weight:600; }
.goal-progress-label { margin-top:4px; color:rgba(255,255,255,.7); font-size:13px; }
.icon-button { border:0; background:transparent; color:rgba(255,255,255,.15); padding:6px; display:grid; place-items:center; }
.icon-button .icon { width:20px; height:20px; }
.goal-extra { margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.1); text-align:center; font-family:Georgia,'Times New Roman',serif; color:rgba(255,255,255,.54); font-size:12px; }
.goal-extra small { display:block; margin-top:4px; color:rgba(255,255,255,.4); font-size:11px; }
.portfolio-card { padding:22px; border-radius:24px; text-align:center; background:linear-gradient(135deg,#1a1a1a,#0a0a0a); border:1px solid rgba(201,168,76,.25); }
.portfolio-label { color:rgba(255,255,255,.54); font-family:Georgia,'Times New Roman',serif; font-size:12px; }
.portfolio-value { margin-top:6px; font-family:Georgia,'Times New Roman',serif; font-size:34px; font-weight:700; }
.portfolio-actions { margin-top:14px; display:flex; justify-content:center; gap:12px; }
.mini-gold-btn { padding:8px 18px; border-radius:10px; border:1px solid rgba(201,168,76,.3); background:transparent; color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:12px; }
.asset-card { margin-bottom:8px; padding:14px; border-radius:16px; background:#0d0d0d; border:1px solid rgba(255,255,255,.06); transition:all .25s ease; }
.asset-card.expanded { border-color:rgba(201,168,76,.3); }
.asset-row { display:flex; align-items:center; }
.asset-icon { width:36px; height:36px; flex:0 0 auto; border-radius:10px; background:rgba(201,168,76,.1); color:var(--gold); display:grid; place-items:center; }
.asset-icon .icon{width:18px;height:18px}
.asset-name { margin-left:12px; flex:1; min-width:0; font-family:Georgia,'Times New Roman',serif; font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.asset-value { color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:14px; font-weight:600; }
.asset-extra { margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.1); text-align:center; color:rgba(255,255,255,.54); font-family:Georgia,'Times New Roman',serif; font-size:12px; }

/* Habits */
.habits-screen {
  height:100%; overflow:hidden; padding-top:max(16px, env(safe-area-inset-top,0px)); display:flex; flex-direction:column; background:var(--bg);
}
.streak-section { display:flex; justify-content:center; align-items:center; }
.streak-divider { width:1px; height:30px; background:rgba(255,255,255,.1); margin:0 20px; }
.streak-badge {
  width:120px; padding:8px 12px; border-radius:16px; display:flex; align-items:center; justify-content:center;
  border:1px solid rgba(255,255,255,.05); background:rgba(255,255,255,.03); transition:all .3s ease;
}
.streak-badge.active { background:rgba(201,168,76,.1); border-color:rgba(201,168,76,.4); box-shadow:0 0 20px rgba(201,168,76,.15); }
.streak-emoji { font-size:14px; }
.streak-badge.active .streak-emoji { font-size:18px; }
.streak-value { margin-left:6px; color:rgba(255,255,255,.38); font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:700; }
.streak-badge.active .streak-value { color:var(--gold); }
.streak-label { margin-left:4px; color:rgba(255,255,255,.4); font-family:Georgia,'Times New Roman',serif; font-size:10px; }
.discipline-wrap { margin-top:24px; display:grid; place-items:center; height:200px; }
.discipline-circle { width:200px; height:200px; position:relative; display:grid; place-items:center; }
.discipline-canvas { position:absolute; inset:0; width:200px; height:200px; }
.discipline-center { position:relative; text-align:center; font-family:Georgia,'Times New Roman',serif; }
.discipline-percent { color:var(--gold); font-size:40px; font-weight:700; letter-spacing:-1px; }
.discipline-ratio { margin-top:2px; color:rgba(255,255,255,.4); font-size:12px; font-weight:500; }
.discipline-label { margin-top:4px; color:rgba(255,255,255,.3); font-size:10px; font-weight:600; letter-spacing:3px; }
.discipline-empty { width:200px; height:200px; border-radius:50%; border:1px solid rgba(255,255,255,.05); display:flex; flex-direction:column; align-items:center; justify-content:center; color:rgba(255,255,255,.2); text-align:center; }
.discipline-empty .icon { width:32px; height:32px; }
.discipline-empty-text { margin-top:8px; font-family:Georgia,'Times New Roman',serif; font-size:13px; line-height:1.4; color:rgba(255,255,255,.25); }
.celebration { text-align:center; animation:celebrateIn .5s ease both; }
.celebration-fire { font-size:44px; animation:elasticPop .55s cubic-bezier(.18,.9,.28,1.35) both; }
.celebration-streak { margin-top:4px; color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:700; }
@keyframes celebrateIn { from{opacity:0; transform:scale(.82)} to{opacity:1; transform:scale(1)} }
@keyframes elasticPop { from{transform:scale(.5)} to{transform:scale(1)} }
.motivation { margin-top:12px; min-height:20px; padding:0 18px; text-align:center; color:rgba(201,168,76,.8); font-family:Georgia,'Times New Roman',serif; font-size:14px; font-style:italic; line-height:1.4; animation:motivationIn .8s ease both; }
@keyframes motivationIn { from{opacity:0} to{opacity:1} }
.habits-workspace { margin-top:20px; flex:1; min-height:0; display:flex; }
.habits-left { width:40%; display:flex; flex-direction:column; min-height:0; }
.calendar-button { margin:6px 4px 0 16px; padding:12px; border-radius:12px; background:rgba(201,168,76,.12); border:1px solid rgba(201,168,76,.5); box-shadow:0 0 10px rgba(201,168,76,.1); display:flex; align-items:center; }
.calendar-button .icon { width:24px; height:24px; color:var(--gold); }
.calendar-title { margin-left:12px; flex:1; min-width:0; font-family:Georgia,'Times New Roman',serif; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.habits-list-wrap { position:relative; margin-top:8px; flex:1; min-height:0; overflow:hidden; }
.habits-list { height:100%; overflow-y:auto; padding:0 4px 24px 16px; scrollbar-width:none; }
.habits-list::-webkit-scrollbar { display:none; }
.habit-card { margin-bottom:8px; padding:12px; border-radius:12px; background:var(--surface); border:1px solid rgba(255,255,255,.05); display:flex; align-items:center; transition:all .3s ease; animation:habitIn .35s ease both; }
.habit-card.done { border-color:rgba(201,168,76,.3); box-shadow:0 0 10px rgba(201,168,76,.05); }
@keyframes habitIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
.habit-check { width:24px; height:24px; margin-right:12px; flex:0 0 auto; border-radius:6px; border:1.5px solid rgba(255,255,255,.15); background:transparent; display:grid; place-items:center; color:var(--gold); padding:0; transition:all .3s ease; }
.habit-check.done { border-color:var(--gold); background:rgba(201,168,76,.15); }
.habit-check.future { border-color:rgba(255,255,255,.1); color:transparent; cursor:default; }
.habit-check .icon { width:16px; height:16px; }
.habit-name { min-width:0; flex:1; color:#fff; font-family:Georgia,'Times New Roman',serif; font-size:14px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:all .3s ease; }
.habit-card.done .habit-name { color:rgba(255,255,255,.38); text-decoration:line-through; text-decoration-color:rgba(201,168,76,.4); text-decoration-thickness:2px; }
.habit-card.future .habit-name { color:rgba(255,255,255,.2); }
.list-fade-top,.list-fade-bottom { position:absolute; left:0; right:0; pointer-events:none; z-index:2; }
.list-fade-top { top:0; height:16px; background:linear-gradient(to bottom,rgba(10,10,10,.95),rgba(10,10,10,0)); }
.list-fade-bottom { bottom:0; height:24px; background:linear-gradient(to bottom,rgba(10,10,10,0),rgba(10,10,10,.8)); }
.habits-empty { height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:20px; text-align:center; }
.habits-empty .icon { width:32px; height:32px; color:rgba(255,255,255,.2); }
.habits-empty-text { margin-top:12px; color:rgba(255,255,255,.25); font-family:Georgia,'Times New Roman',serif; font-size:13px; line-height:1.5; }
.add-habit-btn { margin:8px 4px 16px 16px; padding:14px 6px; border-radius:14px; border:1px solid rgba(201,168,76,.5); background:linear-gradient(135deg,rgba(201,168,76,.1),rgba(201,168,76,.05)); color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:15px; font-weight:600; text-align:center; }
.graph-pane { flex:1; min-width:0; position:relative; overflow:hidden; }
.graph-scroller { position:absolute; inset:0; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
.graph-scroller::-webkit-scrollbar{display:none}
.graph-inner { width:1736px; min-height:100%; height:100%; display:flex; flex-direction:column; }
.date-strip { height:64px; flex:0 0 64px; display:flex; align-items:flex-start; padding-left:28px; padding-right:28px; }
.date-item { width:52px; height:52px; margin:0 2px; flex:0 0 52px; border-radius:12px; border:.8px solid rgba(255,255,255,.08); background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:all .25s ease; padding:0; }
.date-item.selected { border:2px solid rgba(201,168,76,.8); box-shadow:0 0 12px rgba(201,168,76,.15); }
.date-item.today { background:rgba(201,168,76,.12); border:1.5px solid var(--gold); box-shadow:0 0 12px rgba(201,168,76,.15); }
.date-day { color:rgba(255,255,255,.4); font-family:Georgia,'Times New Roman',serif; font-size:9px; }
.date-item.selected .date-day,.date-item.today .date-day { color:var(--gold); font-weight:700; }
.date-num { margin-top:2px; color:rgba(255,255,255,.5); font-family:Georgia,'Times New Roman',serif; font-size:11px; }
.date-item.selected .date-num { color:#fff; font-weight:700; }
.date-item.today .date-num { color:var(--gold); font-weight:700; }
.date-progress { margin-top:3px; width:24px; height:2px; border-radius:1px; overflow:hidden; background:rgba(255,255,255,.1); }
.date-progress > span { display:block; height:100%; background:var(--gold); border-radius:1px; }
.graph-canvas-wrap { margin-top:8px; flex:1; min-height:0; position:relative; }
.habits-chart { width:1736px; height:100%; min-height:140px; display:block; }
.graph-fade-left,.graph-fade-right { position:absolute; top:0; bottom:0; z-index:3; pointer-events:none; }
.graph-fade-left { left:0; width:67px; background:linear-gradient(to right,rgba(10,10,10,.95),rgba(10,10,10,0)); }
.graph-fade-right { right:0; width:24px; background:linear-gradient(to left,rgba(10,10,10,.95),rgba(10,10,10,0)); }

/* Modal system */
.overlay {
  position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; animation:overlayIn .2s ease both;
}
@keyframes overlayIn { from{opacity:0} to{opacity:1} }
.modal {
  width:min(520px,100%); max-height:88dvh; overflow:auto; background:#111; border-radius:20px; border:1px solid rgba(201,168,76,.3); box-shadow:0 24px 80px rgba(0,0,0,.65); padding:22px; animation:modalIn .38s cubic-bezier(.16,.84,.28,1.15) both; scrollbar-width:none;
}

.gold-action { border:0; border-radius:12px; background:linear-gradient(135deg,var(--gold2),#c9a94e); color:#000; padding:10px 16px; font-family:Georgia,'Times New Roman',serif; font-size:14px; font-weight:600; }
.danger-action { border:0; background:transparent; color:var(--red); padding:10px 12px; font-family:Georgia,'Times New Roman',serif; }
.field { width:100%; border-radius:12px; border:1px solid rgba(201,168,76,.2); background:#090909; color:#fff; padding:12px 14px; outline:none; font-family:Georgia,'Times New Roman',serif; font-size:15px; }
.field::placeholder { color:rgba(255,255,255,.3); }

.form-gap { height:14px; }
.type-toggle { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.type-btn { padding:12px; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:transparent; color:rgba(255,255,255,.7); font-family:Georgia,'Times New Roman',serif; }
.type-btn.expense.active { border-color:var(--red); background:rgba(255,90,90,.1); }
.type-btn.income.active { border-color:var(--green); background:rgba(76,175,80,.1); }
.sheet-overlay { align-items:flex-end; padding:0; }
.sheet { width:100%; max-height:82dvh; overflow:auto; background:#111; border-radius:28px 28px 0 0; padding:12px 24px calc(32px + var(--safe-bottom)); animation:sheetIn .28s cubic-bezier(.16,.84,.28,1) both; scrollbar-width:none; }
.sheet::-webkit-scrollbar{display:none}
@keyframes sheetIn { from{transform:translateY(100%)} to{transform:none} }
.sheet-handle { width:40px; height:4px; margin:0 auto; border-radius:2px; background:rgba(255,255,255,.15); }
.sheet-title { margin-top:20px; text-align:center; font-family:Georgia,'Times New Roman',serif; font-size:20px; font-weight:600; }
.sheet-sub { margin-top:8px; text-align:center; color:rgba(255,255,255,.4); font-family:Georgia,'Times New Roman',serif; font-size:14px; }
.sheet-option { margin-top:12px; padding:16px; border-radius:16px; background:rgba(255,255,255,.03); border:1px solid rgba(201,168,76,.15); display:flex; align-items:center; }
.sheet-option-icon { width:44px; height:44px; border-radius:12px; background:rgba(201,168,76,.1); color:var(--gold); display:grid; place-items:center; }
.sheet-option-icon .icon { width:22px; height:22px; }
.sheet-option-main { margin-left:14px; flex:1; font-family:Georgia,'Times New Roman',serif; }
.sheet-option-title { color:var(--gold); font-size:15px; font-weight:500; }
.sheet-option-sub { margin-top:2px; color:rgba(255,255,255,.4); font-size:12px; }
.sheet-option .chev { color:rgba(201,168,76,.5); }
.sheet-option.danger { border-color:rgba(255,90,90,.15); }
.sheet-option.danger .sheet-option-icon { background:rgba(255,90,90,.1); color:var(--red); }
.sheet-option.danger .sheet-option-title, .sheet-option.danger .chev { color:var(--red); }
.filter-wrap { margin-top:16px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
.filter-chip { padding:8px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.05); color:rgba(255,255,255,.7); font-family:Georgia,'Times New Roman',serif; font-size:12px; }
.filter-chip.active { background:rgba(201,168,76,.2); border-color:var(--gold); color:var(--gold); }

/* Tooltip */
.tooltip-card { width:min(85vw,460px); padding:24px; border-radius:20px; background:linear-gradient(135deg,#1a1a1a,#111); border:1px solid rgba(201,168,76,.3); box-shadow:0 10px 50px rgba(201,168,76,.2); text-align:center; animation:tooltipIn .5s cubic-bezier(.2,.9,.2,1.25) both; }
@keyframes tooltipIn { from{opacity:0; transform:scale(.85)} to{opacity:1; transform:scale(1)} }
.tooltip-icon { width:72px; height:72px; margin:0 auto; border-radius:50%; display:grid; place-items:center; background:linear-gradient(135deg,rgba(201,168,76,.2),rgba(201,168,76,.05)); font-size:36px; }
.tooltip-title { margin-top:16px; color:var(--gold); font-family:Georgia,'Times New Roman',serif; font-size:22px; font-weight:700; letter-spacing:1px; }
.tooltip-text { margin:8px 8px 0; color:rgba(255,255,255,.7); font-family:Georgia,'Times New Roman',serif; font-size:15px; line-height:1.6; }
.tooltip-ok { margin-top:20px; border:0; border-radius:12px; background:linear-gradient(135deg,var(--gold),rgba(201,168,76,.8)); color:#000; padding:12px 32px; font-family:Georgia,'Times New Roman',serif; font-size:16px; font-weight:600; }

/* Calendar */
.calendar-modal { width:min(calc(100vw - 32px),720px); height:min(85dvh,760px); background:var(--surface); border-radius:24px; border:1px solid rgba(201,168,76,.3); box-shadow:0 0 40px rgba(0,0,0,.5); overflow:hidden; display:flex; flex-direction:column; animation:calendarIn .4s cubic-bezier(.18,.85,.24,1.15) both; }
@keyframes calendarIn { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
.calendar-top { padding:20px; background:rgba(201,168,76,.05); }
.calendar-top-row { display:grid; grid-template-columns:44px 1fr 44px; align-items:center; }
.calendar-close,.calendar-today { width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center; }
.calendar-close{color:rgba(255,255,255,.54)} .calendar-today{color:var(--gold)}
.calendar-top-title { text-align:center; font-family:Georgia,'Times New Roman',serif; font-size:18px; font-weight:600; }
.calendar-search-box { margin-top:12px; background:var(--bg); border:1px solid rgba(201,168,76,.3); border-radius:12px; overflow:hidden; }
.calendar-search-row { display:flex; align-items:center; }
.calendar-search-row .icon { width:20px;height:20px;color:var(--gold);margin-left:14px; }
.calendar-search { flex:1; border:0;background:transparent;color:#fff;outline:0;padding:12px 14px 12px 10px;font-family:Georgia,'Times New Roman',serif;font-size:14px; }
.calendar-search::placeholder{color:rgba(255,255,255,.3)}
.search-suggestions { max-height:120px; overflow:auto; border-top:1px solid rgba(255,255,255,.05); }
.suggestion { padding:10px 16px; color:rgba(255,255,255,.7); font-family:Georgia,'Times New Roman',serif; font-size:14px; }
.suggestion:active{background:rgba(255,255,255,.04)}
.calendar-nav { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
.calendar-nav-group { display:flex; }
.calendar-nav-btn { width:42px;height:42px;border:0;background:transparent;color:#fff;display:grid;place-items:center; }
.calendar-nav-btn.muted{color:rgba(255,255,255,.54)}
.calendar-month-title { font-family:Georgia,'Times New Roman',serif; font-size:18px; font-weight:500; }
.week-head { display:grid; grid-template-columns:repeat(7,1fr); padding:0 8px; }
.week-head span { text-align:center; color:rgba(255,255,255,.38); font-family:Georgia,'Times New Roman',serif; font-size:12px; font-weight:500; padding:4px 0; }
.calendar-grid { flex:1; min-height:0; overflow:auto; display:grid; grid-template-columns:repeat(7,1fr); align-content:start; padding:8px; }
.calendar-day { aspect-ratio:1.1; min-height:38px; margin:2px; border-radius:50%; border:0; background:transparent; color:#fff; font-family:Georgia,'Times New Roman',serif; font-size:15px; }
.calendar-day.other { color:rgba(255,255,255,.2); }
.calendar-day.today { color:var(--gold); background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.5); font-weight:700; }
.calendar-day.selected { color:var(--gold); background:rgba(201,168,76,.2); border:2px solid var(--gold); font-weight:700; }
.calendar-bottom { padding:16px; background:rgba(201,168,76,.05); display:flex; align-items:center; }
.calendar-selected { flex:1; min-width:0; font-family:Georgia,'Times New Roman',serif; }
.calendar-selected-title { font-size:16px; font-weight:600; }
.calendar-selected-sub { margin-top:2px; color:rgba(201,168,76,.7); font-size:13px; }
.calendar-confirm { border:0;border-radius:12px;background:var(--gold);color:var(--bg);padding:12px 32px;font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:600; }

/* Toast */
.toast-root { position:fixed; left:16px; right:16px; bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px); z-index:500; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
.toast { max-width:520px; width:100%; padding:12px 16px; border-radius:12px; background:var(--red); color:#fff; font-family:Georgia,'Times New Roman',serif; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.4); animation:toastIn .25s ease both; }
.toast.ok { background:#2e7d32; }
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}


/* Flutter AnimatedContainer / AnimatedCrossFade parity on DOM replacement */

.advice-card:has(.insight) { animation: dnaExpand300 .3s ease-out both; }

@keyframes dnaExpand300 { from { opacity:.86; transform:scale(.992); } to { opacity:1; transform:none; } }
@keyframes dnaExpand350 { from { opacity:.84; transform:scale(.99); } to { opacity:1; transform:none; } }

  // -------- Finance computed state --------
  function totalBalance() { return openingBalance + totalIncome() - totalExpense(); }
  function totalIncome() { return state.finance.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+Math.abs(num(t.amount)),0); }
  function totalExpense() { return state.finance.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+Math.abs(num(t.amount)),0); }
  function freeMoney() { return totalIncome() - totalExpense(); }
  function expensesByCategory() {
    const out = {};
    for (const t of state.finance.transactions) {
      if (t.type !== 'expense') continue;
      const cat = t.category || 'Другое';
      out[cat] = (out[cat] || 0) + Math.abs(num(t.amount));
    }
    return out;
  }
  function sortedTransactions() {
    return [...state.finance.transactions].sort((a,b)=>parseLocalDate(b.date)-parseLocalDate(a.date));
  }
  function filteredTransactions() {
    const f = state.finance.historyFilter;
    const arr = sortedTransactions();
    if (f === 'Все') return arr;
    if (f === 'Доходы') return arr.filter(t=>t.type==='income');
    if (f === 'Расходы') return arr.filter(t=>t.type==='expense');
    return arr.filter(t=>(t.category||'')===f);
  }
  function ruFinanceDateKey(dt) {
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return `${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
  }
  function groupedTransactions() {
    const map = new Map();
    for (const t of filteredTransactions()) {
      const key = ruFinanceDateKey(parseLocalDate(t.date));
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(t);
    }
    return map;
  }
  function aiAdvice() {
    if (!state.finance.transactions.length) return 'Добавьте операции для анализа';
    if (freeMoney() < 0) return 'Расходы превышают доходы. Пересмотрите бюджет';
    const top = Object.entries(expensesByCategory()).sort((a,b)=>b[1]-a[1]);
    if (top.length && top[0][1] > totalExpense() * .3) return `Основные траты: ${top[0][0]}. Попробуйте сократить расходы в этой категории`;
    return 'Финансы в порядке. Продолжайте в том же духе';
  }
  function aiInsights() {
    if (!state.finance.transactions.length) return [];
    const out = [];
    const top = Object.entries(expensesByCategory()).sort((a,b)=>b[1]-a[1]);
    if (top.length) out.push(`Самая затратная категория: ${top[0][0]} (₽${formatNum(top[0][1])})`);
    out.push(`Свободных средств: ₽${formatNum(freeMoney())}`);
    if (totalIncome() > 0) out.push(`Норма сбережения: ${Math.round(freeMoney()/totalIncome()*100)}%`);
    return out;
  }
  function chartPoints() {
    const tx = state.finance.transactions;
    if (!tx.length) return [0,0,0,0,0,0,0];
    const sorted = [...tx].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const n = sorted.length, step = n/7, pts=[];
    for (let i=0;i<7;i++) {
      let cum=0;
      const limit = clamp(Math.round((i+1)*step - 1), 0, n-1);
      for (let j=0;j<=limit;j++) {
        const t=sorted[j];
        if (state.finance.chartMode===0) cum += t.type==='income' ? num(t.amount) : -num(t.amount);
        else if (state.finance.chartMode===1) cum += t.type==='income' ? num(t.amount) : 0;
        else cum += t.type==='expense' ? num(t.amount) : 0;
      }
      pts.push(cum);
    }
    return pts;
  }

  function habitDateKey(d) { return isoDate(d); }
  function habitsForDate(d) { return state.habits.data[habitDateKey(d)] || []; }
  function progressForDate(d) {
    const habits = habitsForDate(d);
    if (!habits.length) return 0;
    return habits.filter(h=>h.done===true).length / habits.length;
  }
  function isPerfectDay(d) {
    const habits = habitsForDate(d);
    return habits.length > 0 && habits.every(h=>h.done===true);
  }
  function currentHabits() { return habitsForDate(state.habits.selectedDate); }
  function currentStreak() {
    let count=0, check=state.habits.today;
    while (isPerfectDay(check)) { count++; check=addDays(check,-1); }
    return count;
  }
  function bestStreak() {
    let best=0,current=0;
    for (let i=730;i>=0;i--) {
      const d=addDays(state.habits.today,-i);
      if (isPerfectDay(d)) { current++; if (current>best) best=current; }
      else current=0;
    }
    if (current>best) best=current;
    return best;
  }
  function allDates() { return Array.from({length:DAYS_TO_SHOW},(_,i)=>addDays(state.habits.selectedDate,i-CENTER_INDEX)); }
  function pluralDays(count) {
    if (count%10===1 && count%100!==11) return 'день';
    if ([2,3,4].includes(count%10) && ![12,13,14].includes(count%100)) return 'дня';
    return 'дней';
  }
  function formatHabitDate(d) {
    const m=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  }
  function dateTitle(d) {
    const today=state.habits.today;
    if (sameDay(d,today)) return `Сегодня, ${formatHabitDate(d)}`;
    if (d<today) {
      const diff=Math.round((today-d)/86400000);
      if (diff===1) return `Вчера, ${formatHabitDate(d)}`;
      if (diff===2) return `Позавчера, ${formatHabitDate(d)}`;
      return formatHabitDate(d);
    }
    return formatHabitDate(d);
  }
  function getTimeOfDay(now=new Date()) { const h=now.getHours(); if(h>=5&&h<12)return'morning'; if(h>=12&&h<18)return'afternoon'; if(h>=18&&h<23)return'evening'; return'night'; }
  function hoursUntilEndOfDay(now=new Date()) { const end=new Date(now.getFullYear(),now.getMonth(),now.getDate(),23,59); return Math.floor((end-now)/3600000); }
  function motivationText(now=new Date()) {
    const tod=getTimeOfDay(now), progress=progressForDate(state.habits.selectedDate), hoursLeft=hoursUntilEndOfDay(now);
    const low=progress<.3, high=progress>=.8, perfect=progress>=1;
    const sel=state.habits.selectedDate, today=state.habits.today;
    if (perfect && sameDay(sel,today)) {
      const phrases=['🔥 День закрыт идеально!','✨ Ты сегодня на высоте!','👑 Идеальный день! Так держать!'];
      return phrases[state.habits.motivationIndex % phrases.length];
    }
    if (sel>today) return '📅 Привычки на этот день ещё предстоит выполнить';
    if (sel<today) {
      if (progress>=1) return '✨ День закрыт идеально';
      if (progress>0) return '📊 Прогресс сохранён';
      return '📭 Здесь пока пусто';
    }
    if(now.getHours()>=21&&hoursLeft<=2){
      if(low)return'🌙 Ещё есть время для одной привычки.';
      return'✨ Можно успеть ещё немного до конца дня.';
    }
    if (tod==='morning') {
      if(progress===0)return'🌅 Новый день — начни с одной привычки.';
      if(low)return'🌅 Хорошее начало — первый шаг уже сделан!';
      if(high)return'⚡ Отличное утро! Ты уже почти всё сделал!';
      return'🚀 Сегодня хороший день для новых рекордов.';
    }
    if (tod==='afternoon') {
      if(low)return'💪 Начать можно прямо сейчас. Маленькие шаги создают большие результаты.';
      if(high)return'🎯 Ты очень близок к идеальному дню. Остался последний шаг!';
      return'🌟 Продолжай в том же темпе. Ты уже движешься к цели.';
    }
    if (tod==='evening') {
      if(hoursLeft<=2&&low)return'⏰ До конца дня осталось совсем немного. У тебя ещё есть шанс закрыть все привычки!';
      if(low)return'🌙 Вечер — отличное время, чтобы закрыть хотя бы одну привычку.';

      return'🌆 День почти завершён. Осталось совсем немного.';
    }
    if(low)return'🌙 Время отдохнуть. Утром — новый старт.';
    if(high)return'✨ Отличная работа перед сном!';

  function renderDnaLoader(label='',quiet=false,large=false) {
    const wave='M26 0 C26 20 74 20 74 40 C74 60 26 60 26 80 C26 100 74 100 74 120 C74 140 26 140 26 160 C26 180 74 180 74 200 C74 220 26 220 26 240';
    const rungs=Array.from({length:25},(_,i)=>{const y=i*10,x=24*Math.cos(y*Math.PI/40);return Math.abs(x)<1?'':`<line class="dna-rung" x1="${50-x}" y1="${y}" x2="${50+x}" y2="${y}"/>`;}).join('');
    return `<div class="dna-loader ${quiet?'dna-loader-quiet':''} ${large?'dna-loader-large':''}" ${label&&!quiet?'role="status"':''}><svg class="dna-symbol" viewBox="0 0 100 120" aria-hidden="true" focusable="false"><g class="dna-track">${rungs}<path class="dna-strand dna-strand-back" d="${wave}" transform="translate(100 0) scale(-1 1)"/><path class="dna-strand" d="${wave}"/></g></svg>${label?`<span class="dna-loader-label">${esc(label)}</span>`:''}</div>`;
  }
  function renderUnavailable(title,description) {
    return `<section class="screen dna-unavailable">${renderDnaLoader('Скоро',true)}<h1>${esc(title)}</h1><p>${esc(description)}</p></section>`;

  // -------- Finance rendering --------
  // Finance 0.3.0: local data retained; no broker or recognition credentials sent.
  const FIN_BLOCKS = {spending:'Расходы по категориям', dynamics:'Доходы и расходы', goals:'Цели', investments:'Инвестиции'};
  const FIN_COLORS = ['#c9a84c','#809c9b','#b98d7f','#8985aa','#a6a77c','#8b9faf','#b993ad','#b2a293'];
  const financePrefs = readFinancePrefs(loadJSON('dna_finance_layout_v1', null));
  const financeView = {page:'overview', period:'month', category:null, search:'', type:'all', rangePeriod:null};
  let openingBalance = num(loadJSON('dna_finance_opening_v1', 0));
  let financeAnimated = new Set();
  function readFinancePrefs(raw) {
    const known=Object.keys(FIN_BLOCKS), order=Array.isArray(raw?.order)?raw.order.filter((k,i,a)=>known.includes(k)&&a.indexOf(k)===i):[];
    const hidden=Array.isArray(raw?.hidden)?raw.hidden.filter(k=>known.includes(k)):['investments'];
    return {order:[...order,...known.filter(k=>!order.includes(k))],hidden};
  }
  function finAmount(t) {return Math.abs(num(t.amount));}
  function finMoney(v) {return new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:2}).format(num(v));}
  function finDate(s) {const d=parseLocalDate(s);return Number.isNaN(d.getTime())?'Без даты':d.toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});}
  function finRange(period=financeView.period, now=new Date()) {
    const end=addDays(dateOnly(now),1);
    const start=period==='week'?addDays(dateOnly(now),-6):period==='year'?new Date(now.getFullYear(),0,1):new Date(now.getFullYear(),now.getMonth(),1);
    return {start,end};
  }
  function finPeriodTx() {const {start,end}=finRange();return state.finance.transactions.filter(t=>{const d=parseLocalDate(t.date);return d>=start&&d<end;});}
  function finTotals(tx) {return tx.reduce((a,t)=>{if(t.type==='income')a.income+=finAmount(t);else if(t.type==='expense')a.expense+=finAmount(t);return a;},{income:0,expense:0});}
  function finGroups(tx=finPeriodTx()) {
    const m=new Map();tx.filter(t=>t.type==='expense').forEach(t=>{const c=t.category||'Другое';m.set(c,(m.get(c)||0)+finAmount(t));});
    return [...m].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  }
  function finAnimation(key) {if(financeAnimated.has(key))return '';financeAnimated.add(key);return ' fin-enter';}
  function finRefresh(focusSelector) {storeCurrentScroll();renderScreen();if(focusSelector)$(focusSelector)?.focus({preventScroll:true});}
  function finGo(page,category=null) {
    storeCurrentScroll();financeView.page=page;
    if(page==='history'){financeView.category=category;financeView.rangePeriod=category?financeView.period:null;financeView.search='';financeView.type='all';financeView.filtersOpen=!!category;viewScroll.set('finance:history',0);}
    renderScreen();$('.fin-heading')?.focus({preventScroll:true});
  }
  function renderFinance() {

    return `<section class="screen finance-screen fin-v3"><div class="finance-scroll"><div class="fin-container">
      <header class="fin-header"><div class="fin-heading-wrap">${!overview?`<button class="fin-icon" data-fin-back aria-label="Назад к обзору">${icon('chev-left')}</button>`:''}<h1 class="fin-heading" tabindex="-1">${titles[page]||'Финансы'}</h1></div>${overview?`<button class="fin-icon" data-fin-customize aria-label="Настроить разделы финансов">${icon('settings')}</button>`:''}</header>

      <div class="fin-quick"><button class="fin-quick-expense" data-fin-add="expense"><span>−</span> Расход</button><button class="fin-quick-income" data-fin-add="income"><span>+</span> Пополнение</button></div>
    </div>

    <section class="fin-card fin-recent"><div class="fin-card-head"><h2>Последние операции</h2><button class="fin-text" data-fin-history>Все ${icon('chev-right')}</button></div>${renderFinTransactions(sortedTransactions().slice(0,3))}</section>
    ${!financePrefs.hidden.includes('spending')?`<section class="fin-card" data-fin-block="spending"><div class="fin-card-head"><h2>Расходы по категориям</h2></div>${renderFinancePeriod()}${renderFinSpending()}${renderFinComment(finTotals(finPeriodTx()))}</section>`:''}`;
  }
  function renderFinanceDetail(page) {
    if(page==='goals')return `<section class="fin-card"><div class="fin-card-head"><h2>Накопления</h2><button class="fin-text" data-fin-goal-new>+ Цель</button></div>${renderFinanceGoals()}</section>`;
    if(page==='investments')return `<section class="fin-card"><div class="fin-card-head"><h2>Портфель</h2><button class="fin-text" data-fin-asset-new>+ Актив</button></div>${renderInvestments()}</section>`;
    const totals=finTotals(finPeriodTx());

  }
  function renderFinComment(totals) {
    const groups=finGroups(),has=totals.income||totals.expense;
    const title=!has?'Добавь первую операцию за этот период':totals.expense>totals.income?`Расходы больше пополнений на ${finMoney(totals.expense-totals.income)}`:`Разница пополнений и расходов: ${finMoney(totals.income-totals.expense)}`;
    return `<details class="fin-comment"><summary>${icon('sparkles')}<span>${esc(title)}</span>${icon('chev-down')}</summary><div class="fin-detail">${groups.length?`Больше всего потрачено в категории «${esc(groups[0][0])}»: ${finMoney(groups[0][1])}. `:''}Это расчёт по внесённым операциям за выбранный период, а не AI-рекомендация. Переводы и неполная история могут влиять на результат.</div></details>`;
  }
  function renderFinTransactions(tx) {
    if(!tx.length)return '<div class="fin-empty">Здесь появятся твои операции.<br><span>Добавь расход или пополнение кнопками выше.</span></div>';
    return `<div class="fin-transactions">${tx.map(t=>{const i=state.finance.transactions.indexOf(t),income=t.type==='income';return `<button class="fin-transaction" data-fin-tx="${i}"><span class="fin-tx-icon ${income?'fin-income':''}">${icon(income?'trend-up':categoryIcon[t.category]||'receipt')}</span><span class="fin-tx-main"><strong>${esc(t.note||t.category||'Операция')}</strong><small>${esc(t.category||'Другое')} · ${finDate(t.date)}</small></span><span class="fin-tx-money ${income?'fin-income':''}">${income?'+':'−'}${finMoney(finAmount(t))}</span></button>`;}).join('')}</div>`;
  }
  function renderFinanceHistory() {
    const active=financeView.type!=='all'||financeView.category||financeView.rangePeriod;
    return `<section class="fin-card fin-history-card">
      <div class="fin-history-toolbar"><input class="fin-field" id="fin-search" type="search" aria-label="Поиск операций" placeholder="Поиск операций" value="${esc(financeView.search)}"><button class="fin-icon" data-fin-add="expense" aria-label="Добавить операцию">${icon('plus')}</button></div>
      <details class="fin-filter-panel" ${financeView.filtersOpen?'open':''}><summary>${icon('filter')} Фильтры${active?' · применены':''}</summary><div class="fin-filter-content">
      <div class="fin-history-filters"><label>Тип<select class="fin-field" id="fin-type"><option value="all">Все операции</option><option value="expense" ${financeView.type==='expense'?'selected':''}>Расходы</option><option value="income" ${financeView.type==='income'?'selected':''}>Пополнения</option></select></label><label>Категория<select class="fin-field" id="fin-category"><option value="">Все категории</option>${[...new Set([...categories,...state.finance.transactions.map(t=>t.category||'Другое')])].map(c=>`<option ${financeView.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
      ${financeView.rangePeriod?'<button class="fin-text" data-fin-clear-period>Снять ограничение периода</button>':''}
      <button class="fin-text" data-fin-import>${icon('pdf')} Импорт фото / PDF</button></div></details>
      <div id="fin-history-results">${renderFinHistoryResults()}</div>

  }

  function renderFinHistoryResults() {
    const q=financeView.search.toLocaleLowerCase('ru-RU').trim();
    const tx=sortedTransactions().filter(t=>(!financeView.rangePeriod||(()=>{const r=finRange(financeView.rangePeriod),date=parseLocalDate(t.date);return date>=r.start&&date<r.end;})())&&(financeView.type==='all'||t.type===financeView.type)&&(!financeView.category||(t.category||'Другое')===financeView.category)&&(!q||`${t.note||''} ${t.category||''} ${finAmount(t)} ${finMoney(finAmount(t))}`.toLocaleLowerCase('ru-RU').includes(q)));
    return `<p class="fin-muted" role="status">Операций: ${tx.length}</p>${tx.length?renderFinTransactions(tx):'<div class="fin-empty">Операций не найдено. Попробуй изменить фильтры.</div>'}`;
  }
  function renderFinSpending() {
    const groups=finGroups(),total=groups.reduce((s,x)=>s+x[1],0);if(!total)return '<div class="fin-empty">Нет расходов за этот период.<br><span>Кольцо появится после добавления расхода.</span></div>';
    let offset=0;
    const arcs=groups.map(([name,value],i)=>{const share=value/total*100,start=offset;offset+=share;return `<circle class="fin-arc" cx="100" cy="100" r="76" pathLength="100" fill="none" stroke="${FIN_COLORS[i%FIN_COLORS.length]}" stroke-width="20" stroke-dasharray="${Math.max(0,share-(groups.length>1?.5:0))} ${100-share+(groups.length>1?.5:0)}" stroke-dashoffset="${-start}" transform="rotate(-90 100 100)" data-fin-sector="${i}" tabindex="0" role="button" aria-label="${esc(name)}: ${finMoney(value)}, ${(share).toFixed(1)} процентов. Открыть операции"><title>${esc(name)}: ${finMoney(value)}</title></circle>`;}).join('');
    return `<div class="fin-spending"><div class="fin-ring"><svg viewBox="0 0 200 200" aria-label="Распределение расходов">${arcs}</svg><div class="fin-ring-center"><span>Расходы</span><strong>${finMoney(total)}</strong></div></div><div class="fin-legend">${groups.map(([name,value],i)=>`<button data-fin-sector="${i}"><span class="fin-swatch" style="background:${FIN_COLORS[i%FIN_COLORS.length]}"></span><span>${esc(name)}<small>${finMoney(value)}</small></span><b>${(value/total*100).toLocaleString('ru-RU',{maximumFractionDigits:1})}%</b></button>`).join('')}</div></div>`;
  }
  function finBuckets() {
    const {start,end}=finRange(),buckets=[],year=financeView.period==='year';
    for(let d=new Date(start);d<end;d=year?new Date(d.getFullYear(),d.getMonth()+1,1):addDays(d,1))buckets.push({key:year?`${d.getFullYear()}-${d.getMonth()}`:isoDate(d),label:d.toLocaleDateString('ru-RU',year?{month:'short'}:{day:'numeric',month:'short'}),income:0,expense:0});
    const map=new Map(buckets.map(b=>[b.key,b]));for(const t of finPeriodTx()){const d=parseLocalDate(t.date),b=map.get(year?`${d.getFullYear()}-${d.getMonth()}`:isoDate(d));if(b&&(t.type==='income'||t.type==='expense'))b[t.type]+=finAmount(t);}return buckets;
  }
  function renderFinDynamics() {
    const b=finBuckets(),max=Math.max(1,...b.flatMap(x=>[x.income,x.expense]));
    if(!b.some(x=>x.income||x.expense))return '<div class="fin-empty">Нет операций за этот период.<br><span>Здесь будет график пополнений и расходов.</span></div>';
    return `<div class="fin-chart-legend"><span><i style="background:#8ea99a"></i>Пополнения</span><span><i style="background:#c9a84c"></i>Расходы</span></div><p class="fin-muted">Верх шкалы: ${finMoney(max)} · нажми на столбец</p><div class="fin-bars">${b.map((x,i)=>`<button class="fin-bar-point" data-fin-point="${i}" aria-label="${x.label}: пополнения ${finMoney(x.income)}, расходы ${finMoney(x.expense)}"><span class="fin-bar-area"><i style="height:${x.income/max*100}%;background:#8ea99a"></i><i style="height:${x.expense/max*100}%;background:#c9a84c"></i></span><small>${b.length<=7||i%5===0||i===b.length-1?x.label:''}</small></button>`).join('')}</div><div id="fin-point-value" class="fin-point-value" aria-live="polite">Выбери день или месяц для точных сумм</div>`;
  }
  function renderFinanceGoals() {
    if(!state.finance.goals.length)return '<div class="fin-empty">На что хочешь накопить?<br><span>Добавь цель — например, новый ноутбук.</span></div>';
    return `<div class="fin-goals">${state.finance.goals.map((g,i)=>{const current=Math.max(0,num(g.current)),target=Math.max(0,num(g.target)),p=target?clamp(current/target,0,1):0,left=Math.max(0,target-current);return `<button class="fin-goal" data-fin-goal="${i}"><span class="fin-goal-title"><strong>${esc(g.name||'Цель')}</strong><span>${Math.round(p*100)}%</span></span><span class="fin-progress"><i style="width:${p*100}%"></i></span><span class="fin-goal-detail">${finMoney(current)} из ${finMoney(target)}</span><span class="fin-muted">${left?`Осталось ${finMoney(left)}`:'Цель достигнута'}${g.deadline?` · до ${finDate(g.deadline)}`:''}</span></button>`;}).join('')}<p class="fin-muted">Накопления отмечаются вручную и не вычитаются из баланса повторно.</p></div>`;
  }
  function renderInvestments() {
    const assets=state.finance.assets,total=assets.reduce((s,a)=>s+Math.max(0,num(a.currentValue)),0);
    return `<div class="fin-portfolio-total">${finMoney(total)}<span>Последняя сохранённая стоимость</span></div>${assets.length?`<div class="fin-allocation" aria-hidden="true">${assets.map((a,i)=>`<i style="width:${total?Math.max(0,num(a.currentValue))/total*100:0}%;background:${FIN_COLORS[i%FIN_COLORS.length]}"></i>`).join('')}</div><div class="fin-legend">${assets.map((a,i)=>`<button data-fin-asset="${i}"><span class="fin-swatch" style="background:${FIN_COLORS[i%FIN_COLORS.length]}"></span><span>${esc(a.name||'Актив')}<small>${finMoney(a.currentValue)}</small></span><b>${total?(Math.max(0,num(a.currentValue))/total*100).toFixed(1):0}%</b></button>`).join('')}</div>`:'<div class="fin-empty">Добавь активы вручную, чтобы видеть состав портфеля.</div>'}<p class="fin-muted">График доходности появится, когда будет история стоимости и пополнений. Текущая сумма не показывает заработок.</p><button class="fin-text" data-fin-broker>${icon('link')} Т‑Инвестиции · подключение в разработке</button>`;
  }
  function finModal(title,body,setup) {
    const root=$('#fin-dialog-root');if(!root)return;
    const previous=document.activeElement,originKey=currentViewKey(),originTop=currentScroller()?.scrollTop||0;
    storeCurrentScroll();
    root.innerHTML=`<dialog class="fin-dialog" aria-labelledby="fin-dialog-title"><div class="fin-dialog-head"><h2 id="fin-dialog-title">${esc(title)}</h2><button class="fin-icon" data-fin-close aria-label="Закрыть">${icon('close')}</button></div>${body}</dialog>`;
    const d=$('dialog',root);d.addEventListener('close',()=>{if(d.parentElement===root)root.innerHTML='';if(previous?.isConnected&&!$('dialog[open]',root))previous.focus({preventScroll:true});if(currentViewKey()===originKey&&!$('dialog[open]')){viewScroll.set(originKey,originTop);const sc=currentScroller();if(sc)sc.scrollTop=originTop;}});
    const close=()=>{if(d.dataset.closing)return;d.dataset.closing='1';d.classList.add('fin-leaving');setTimeout(()=>{if(d.open)d.close();},window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:160);};
    $('[data-fin-close]',d).onclick=close;
    d.addEventListener('cancel',e=>{e.preventDefault();close();});
    d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();}});
    d.showModal();if(setup)setup(d,close);
  }
  function finError(d,text) {const e=$('[data-fin-error]',d);if(e)e.textContent=text;}
  function finSaveData(d,key) {
    try {localStorage.setItem(key,JSON.stringify(state.finance[key]));return true;}catch(e){finError(d,'Не удалось сохранить в браузере. Освободи место и повтори.');return false;}
  }
  function parseFinInput(raw) {
    const s=String(raw).trim().replace(/\u00a0|\u202f/g,' ').replace(/−/g,'-');
    const re=/[+-]?\d+(?:[ ]\d{3})*(?:[.,]\d{1,2})?(?:\s*(?:тысяч(?:а|и|у)?|тыс\.?|[кk]|млн|миллион(?:а|ов)?)(?![a-zа-яё]))?/gi;
    const matches=[...s.matchAll(re)];if(matches.length!==1)return {error:matches.length?'В записи несколько чисел. Оставь одну сумму, остальные детали перенеси в примечание.':'Введи сумму, например 60 000 или 60 тысяч на Турцию.'};
    const token=matches[0][0],match=token.match(/^([+-]?\d+(?:[ ]\d{3})*(?:[.,]\d{1,2})?)\s*(.*)$/i);
    const unit=match[2].toLowerCase(),factor=/млн|миллион/.test(unit)?1000000:unit?1000:1;
    const amount=Math.round(Math.abs(Number(match[1].replace(/ /g,'').replace(',','.')))*factor*100)/100;
    if(!Number.isFinite(amount)||amount<=0||amount>1e12)return {error:'Укажи положительную сумму до 1 трлн ₽.'};
    const expense=/(?:потрат|оплат|купил|купила|расход)/i.test(s),income=/(?:получил|получила|поступил|пополнил|пополнила|зарплат|доход)/i.test(s);
    if(expense&&income)return {error:'Неясно, расход это или пополнение. Уточни запись.'};
    let note=(s.slice(0,matches[0].index)+s.slice(matches[0].index+token.length)).replace(/(?:руб(?:лей|ля|ль)?\.?|₽)/gi,'').replace(/\bRUB\b/gi,'').replace(/(?:я\s+)?(?:потратил[аи]?|оплатил[аи]?|купил[аи]?|получил[аи]?|пополнил[аи]?|поступило|расход|доход)\s*/gi,'').replace(/\s+/g,' ').trim();
    return {amount,note,type:expense||match[1].startsWith('-')?'expense':income||match[1].startsWith('+')?'income':null};
  }

      function move(key,dir){const i=draft.order.indexOf(key),j=clamp(i+dir,0,draft.order.length-1);draft.order.splice(i,1);draft.order.splice(j,0,key);draw();$(`[data-layout-handle="${key}"]`,d)?.focus();$('#fin-layout-status',d).textContent=`${FIN_BLOCKS[key]}: позиция ${j+1}`;}

  function habitChartHit(canvas,clientX,clientY) {
    const rect=canvas.getBoundingClientRect(),x=clientX-rect.left,y=clientY-rect.top;
    if(x<0||y<0||x>rect.width||y>rect.height)return null;
    let closest=null,distance=18;
    for(const point of canvas.habitHitPoints||[]){const d=Math.hypot(point.x-x,point.y-y);if(d<=distance){closest=point;distance=d;}}
    return closest;
  }
  function bindHabitChartGestures(canvas,scroller) {
    let press=null,lastScroll=-Infinity;
    scroller.addEventListener('scroll',()=>{lastScroll=performance.now();if(press&&Math.abs(scroller.scrollLeft-press.scroll)>3)press=null;},{passive:true});
    canvas.addEventListener('pointerdown',e=>{
      if(e.isPrimary===false||e.button!==0){press=null;return;}
      if(performance.now()-lastScroll<120){press=null;return;}
      const hit=habitChartHit(canvas,e.clientX,e.clientY);
      press=hit?{id:e.pointerId,x:e.clientX,y:e.clientY,at:performance.now(),scroll:scroller.scrollLeft,date:hit.date}:null;
    },{passive:true});
    canvas.addEventListener('pointermove',e=>{if(press&&e.pointerId===press.id&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>8)press=null;},{passive:true});
    canvas.addEventListener('pointercancel',()=>{press=null;},{passive:true});
    canvas.addEventListener('pointerleave',()=>{press=null;},{passive:true});
    canvas.addEventListener('pointerup',e=>{
      const start=press;press=null;
      if(!start||e.pointerId!==start.id||performance.now()-start.at>450||Math.hypot(e.clientX-start.x,e.clientY-start.y)>8||Math.abs(scroller.scrollLeft-start.scroll)>3)return;
      const hit=habitChartHit(canvas,e.clientX,e.clientY);
      if(hit&&sameDay(hit.date,start.date))selectHabitDate(hit.date);
    },{passive:true});
  }
  function closeHabitSwipes(except=null) {
    $$('.habit-swipe').forEach(row=>{if(row!==except)row.closeSwipe?.();});
  }
  function habitSwipeDestination(offset,velocity,width) {
    return Math.abs(velocity)>.35 ? velocity<0 : offset<-width*.45;
  }
  function bindHabitSwipe(card) {
    const row=card.closest('.habit-swipe'),actions=$('.habit-swipe-actions',row),buttons=Array.from(actions.querySelectorAll('button'));
    let press=null,offset=0,open=false,suppressClick=false,frame=0,span=0;
    const stop=()=>{cancelAnimationFrame(frame);frame=0;};
    const paint=value=>{
      offset=clamp(value,-span,0);
      card.style.transform='translate3d('+offset+'px,0,0)';
      const progress=Math.abs(offset)/Math.max(1,span);
      const reveal=1-Math.pow(1-progress,2.7);
      actions.style.opacity=progress>0?'1':'0';
      buttons.forEach((button,i)=>{
        const center=span/2+(i-.5)*56;
        const travel=(span-22-center)*(1-reveal);
        button.style.transform='translate3d('+travel+'px,0,0) scale('+(reducedMotion()?1:.3+.7*reveal)+')';
        button.style.opacity=String(reveal);
      });
    };
    const settle=(value,velocity=0)=>{
      stop();open=value;row.classList.toggle('is-open',open);row.classList.remove('is-dragging');
      actions.inert=!open;actions.setAttribute('aria-hidden',String(!open));card.inert=open;card.setAttribute('aria-hidden',String(open));
      const target=open?-span:0;if(reducedMotion()||Math.abs(target-offset)<.2){paint(target);return;}
      const from=offset,start=performance.now(),omega=24;
      const initialVelocity=clamp(velocity*1000,-1200,1200),delta=from-target;
      const tick=now=>{
        if(!row.isConnected){frame=0;return;}
        const t=(now-start)/1000;
        const next=target+(delta+(initialVelocity+omega*delta)*t)*Math.exp(-omega*t);
        paint(next);
        if(Math.abs(target-next)<.15||t>.55){paint(target);frame=0;}
        else frame=requestAnimationFrame(tick);
      };frame=requestAnimationFrame(tick);
    };
    row.closeSwipe=()=>{if(open||press?.axis==='x'){press=null;span=row.getBoundingClientRect().width;settle(false);}};
    row.addEventListener('pointerdown',e=>{
      if(e.isPrimary===false||e.button!==0){press=null;settle(open);return;}
      stop();span=row.getBoundingClientRect().width;suppressClick=false;closeHabitSwipes(row);
      const now=performance.now();press={id:e.pointerId,x:e.clientX,y:e.clientY,from:offset,lastX:e.clientX,wasOpen:open,axis:null,samples:[{x:e.clientX,at:now}]};
    },{passive:true});
    row.addEventListener('pointermove',e=>{
      if(!press||e.pointerId!==press.id)return;
      const dx=e.clientX-press.x,dy=e.clientY-press.y,now=performance.now();
      if(!press.axis){if(Math.max(Math.abs(dx),Math.abs(dy))<=8)return;press.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';if(press.axis==='x'){row.classList.add('is-dragging');row.setPointerCapture?.(e.pointerId);card.cancelLongPress?.();}}
      if(press.axis!=='x')return;
      e.preventDefault();suppressClick=true;paint(press.from+dx);press.lastX=e.clientX;
      press.samples.push({x:e.clientX,at:now});while(press.samples.length>2&&press.samples[0].at<now-80)press.samples.shift();
    },{passive:false});
    row.addEventListener('pointerup',e=>{
      if(!press||e.pointerId!==press.id)return;
      const gesture=press;press=null;
      if(gesture.axis==='x'){
        suppressClick=true;paint(gesture.from+e.clientX-gesture.x);
        const now=performance.now(),samples=gesture.samples.filter(p=>now-p.at<=100),first=samples[0];
        const velocity=first&&now>first.at?(e.clientX-first.x)/(now-first.at):0;
        settle(habitSwipeDestination(offset,velocity,span),velocity);
      }else if(offset!==0&&offset!==-span)settle(gesture.wasOpen);
    },{passive:true});
    row.addEventListener('pointercancel',()=>{if(press?.axis==='x')suppressClick=true;press=null;settle(open);},{passive:true});
    row.addEventListener('click',e=>{
      if(suppressClick){suppressClick=false;e.preventDefault();e.stopImmediatePropagation();return;}
      if(open&&e.target.closest('.habit-card')){e.preventDefault();e.stopImmediatePropagation();settle(false);}
    },{capture:true});
    row.addEventListener('keydown',e=>{if(e.key==='Escape'&&open){e.preventDefault();settle(false);card.focus({preventScroll:true});}});
  }
  function updateHabitUI() {
    if(state.nav!==3||!$('.habits-screen'))return;
    const list=currentHabits(),existing=$$('[data-habit-index]');
    if(existing.length!==list.length||existing.some((el,i)=>$('.habit-name',el)?.textContent!==list[i].name)){
      storeCurrentScroll();renderScreen();return;
    }
    existing.forEach((el,i)=>{const done=list[i].done===true;el.classList.toggle('done',done);const check=$('.habit-check',el);check.classList.toggle('done',done);check.setAttribute('aria-pressed',String(done));check.innerHTML=done?icon('check'):'';});
    const ratio=$('.discipline-ratio');if(ratio)ratio.textContent=list.filter(h=>h.done===true).length+' из '+list.length;
    const counts=$$('.streak-value');[currentStreak(),bestStreak()].forEach((v,i)=>{if(counts[i]){counts[i].textContent=v;counts[i].dataset.countTo=v;counts[i].closest('.streak-badge').classList.toggle('active',v>0);}});
    const motivation=$('#motivation-text');if(motivation)motivation.textContent=motivationText();
    $$('.date-item').forEach(b=>{const p=progressForDate(parseLocalDate(b.dataset.date));let mark=$('.date-progress',b);if(p>0){if(!mark){mark=document.createElement('span');mark.className='date-progress';mark.innerHTML='<span></span>';b.appendChild(mark);}mark.firstElementChild.style.width=p*100+'%';}else mark?.remove();});
  }
  function prepareHabitAnimation(prev,target) {
    const from=Number.isFinite(state.habits.circleDisplay)?state.habits.circleDisplay:prev;
    cancelAnimationFrame(habitAnimationFrame);
    state.habits.animStart=from;state.habits.animEnd=target;state.habits.circleDisplay=from;
    state.habits.previousProgressMap[habitDateKey(state.habits.selectedDate)]=from;
    state.habits.animatingDate=new Date(state.habits.selectedDate);state.habits.celebrationUntil=0;
    updateHabitUI();animateHabitProgress(from,target);
  }
  function animateHabitProgress(startValue,endValue) {
    cancelAnimationFrame(habitAnimationFrame);
    const key=isoDate(state.habits.selectedDate),start=performance.now(),duration=reducedMotion()?0:280;
    function frame(now){if(state.nav!==3||isoDate(state.habits.selectedDate)!==key)return;
      const t=duration?clamp((now-start)/duration,0,1):1,value=startValue+(endValue-startValue)*easeOutCubic(t);
      state.habits.circleDisplay=value;drawDiscipline(value);drawHabitsChart(easeOutCubic(t));const el=$('#discipline-percent');if(el)el.textContent=Math.round(value*100)+'%';
      if(t<1)habitAnimationFrame=requestAnimationFrame(frame);else{state.habits.circleDisplay=endValue;state.habits.animatingDate=null;habitAnimationFrame=0;}
    }habitAnimationFrame=requestAnimationFrame(frame);
  }
  function returnToToday() {
    state.habits.today=dateOnly();selectHabitDate(state.habits.today);scrollToSelectedHabitDate();
    const circle=$('.discipline-wrap');if(circle&&!reducedMotion())circle.animate?.([{opacity:.75},{opacity:1}],{duration:180,easing:'ease-out'});
  }
  function selectHabitDate(d) {
    if(!d||Number.isNaN(d.getTime())||sameDay(d,state.habits.selectedDate))return;
    storeCurrentScroll();cancelAnimationFrame(habitAnimationFrame);state.habits.today=dateOnly();
    state.habits.selectedDate=dateOnly(d);state.habits.circleDisplay=progressForDate(d);state.habits.animatingDate=null;state.habits.celebrationUntil=0;
    renderScreen();scrollToSelectedHabitDate();
  }
  function scrollToSelectedHabitDate() {
    const sc=$('.graph-scroller'),selected=$('.date-item.selected');if(!sc||!selected)return;
    sc.scrollLeft=clamp(selected.offsetLeft-sc.offsetLeft-(sc.clientWidth-selected.offsetWidth)/2,0,Math.max(0,sc.scrollWidth-sc.clientWidth));

  function bindScreenEvents() {
    if(state.nav===0) bindFinanceEvents();
    if(state.nav===2) bindHomeEvents();
